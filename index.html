<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moose Group Points Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --surface: #fffdf8;
    --surface-2: #ece6d8;
    --ink: #24201a;
    --ink-dim: #5c5548;
    --line: #ddd4c2;
    --accent: #2f5233;
    --accent-2: #4b7a4e;
    --accent-soft: #dce8dd;
    --amber: #a8641a;
    --amber-soft: #f3e3cc;
    --red: #a2402a;
    --red-soft: #f2ddd4;
    --radius: .7rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191d16;
      --surface: #22261d;
      --surface-2: #2a2f22;
      --ink: #ece7da;
      --ink-dim: #aca690;
      --line: #3a3f30;
      --accent: #7cb885;
      --accent-2: #9bcf9f;
      --accent-soft: #2b3a2c;
      --amber: #d99a4e;
      --amber-soft: #3a2f1c;
      --red: #d97e63;
      --red-soft: #3a2620;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  h2 { font-size: 1.35rem; margin-bottom: .25rem; }
  h3 { font-size: 1.05rem; }
  p { color: var(--ink-dim); }

  header.app-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: .75rem; padding-bottom: 1rem; margin-bottom: .75rem;
    border-bottom: 1px solid var(--line);
  }
  header.app-header h1 { font-size: clamp(1.4rem, 3.5vw, 1.9rem); }
  .header-eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 .15rem; }

  #langToggle {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: .4rem .9rem; font-weight: 600; font-size: .85rem;
  }
  #langToggle:hover { border-color: var(--accent); color: var(--accent); }

  #deadlineBanner {
    padding: .9rem 1.1rem; border-radius: var(--radius); margin: 0 0 1.25rem;
    background: var(--surface); border: 1px solid var(--line);
    font-size: .95rem; font-weight: 500;
    display: flex; align-items: center; gap: .6rem;
  }
  #deadlineBanner::before { content: "\1F4C5"; font-size: 1.1rem; }
  #deadlineBanner.urgent { background: var(--amber-soft); border-color: var(--amber); color: var(--ink); }
  #deadlineBanner.urgent::before { content: "\23F3"; }

  nav.tabs {
    display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--line); padding-bottom: 0;
  }
  nav.tabs button {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--ink-dim); font-family: "Source Sans 3", sans-serif; font-weight: 600;
    font-size: .92rem; padding: .55rem .8rem; cursor: pointer; border-radius: .35rem .35rem 0 0;
  }
  nav.tabs button:hover { color: var(--ink); background: var(--surface-2); }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein .15s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  section { margin-bottom: 2rem; }
  section > p:first-of-type { margin-top: .15rem; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .85rem; margin: 1rem 0 1.5rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1rem 1.1rem;
  }
  .stat-card .stat-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim); font-weight: 600; margin-bottom: .3rem; }
  .stat-card .stat-value { font-family: "Fraunces", Georgia, serif; font-size: 1.5rem; font-weight: 600; }
  .stat-card .stat-sub { font-size: .82rem; color: var(--ink-dim); margin-top: .15rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1rem 1.1rem;
  }
  .card h3 { margin-top: 0; margin-bottom: .35rem; color: var(--accent); }
  .card p { margin: 0; font-size: .9rem; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.1rem 1.2rem; margin-top: .75rem;
  }

  table { width: 100%; border-collapse: collapse; margin-top: .75rem; font-size: .92rem; }
  th, td { border-bottom: 1px solid var(--line); padding: .55rem .6rem; text-align: left; }
  thead th { color: var(--ink-dim); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  tbody tr:hover { background: var(--surface-2); }
  .table-scroll { overflow-x: auto; }

  button {
    cursor: pointer; font-family: inherit; border-radius: .5rem; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: .5rem .9rem; font-weight: 600; font-size: .88rem;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  #dataSection input[type="file"] {
    display: block; margin: .6rem 0; padding: .6rem; border: 1px dashed var(--line);
    border-radius: .5rem; background: var(--surface); width: 100%; max-width: 420px; font-size: .85rem;
  }
  #templateLink { display: inline-block; margin: .5rem .5rem .5rem 0; font-weight: 600; color: var(--accent); }

  .roster-actions { margin-top: .75rem; }
  #rosterTable input[type="number"] { width: 4.5rem; }
  #rosterTable input[type="text"] { width: 7rem; }
  #rosterTable input {
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    border-radius: .35rem; padding: .3rem .45rem; font: inherit; font-size: .88rem;
  }
  #rosterTable input:focus { border-color: var(--accent); outline: none; }
  #rosterTable button[data-action="delete-entry"] {
    width: 1.8rem; height: 1.8rem; padding: 0; line-height: 1; border-radius: .4rem;
  }
  #rosterTable button[data-action="delete-entry"]:hover { border-color: var(--red); color: var(--red); }
  #rosterTable tr td[colspan] button { font-size: .82rem; }

  .target-controls { display: flex; flex-wrap: wrap; gap: .9rem 1.4rem; align-items: center; }
  .target-controls label { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; font-weight: 600; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .04em; }
  .target-controls select {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: .45rem; padding: .4rem .55rem; font: inherit; font-size: .92rem; text-transform: none; letter-spacing: 0;
  }
  .warning {
    color: var(--red); background: var(--red-soft); border: 1px solid var(--red);
    border-radius: .5rem; padding: .6rem .8rem; margin-top: .9rem; font-size: .88rem;
  }

  .pill { display: inline-block; padding: .18rem .6rem; border-radius: 999px; font-size: .78rem; font-weight: 700; }
  .pill-gap { background: var(--red-soft); color: var(--red); }
  .pill-ok { background: var(--accent-soft); color: var(--accent); }
  .pill-stacked { background: var(--amber-soft); color: var(--amber); }

  .chart-legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; margin-top: .75rem; font-size: .85rem; color: var(--ink-dim); }
  .chart-legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .chart-legend i { width: .7rem; height: .7rem; border-radius: 50%; display: inline-block; }
  #pointsChart { overflow-x: auto; }
  #pointsChart svg text { fill: var(--ink-dim); font-family: "Source Sans 3", sans-serif; }

  @media (max-width: 640px) {
    .target-controls { flex-direction: column; align-items: stretch; }
    nav.tabs { overflow-x: auto; flex-wrap: nowrap; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<div class="wrap">

<header class="app-header">
  <div>
    <p class="header-eyebrow">&#x1F98C; Group Points Tracker</p>
    <h1 id="appTitle">Moose Group Points Tracker</h1>
  </div>
  <button id="langToggle" type="button">FR</button>
</header>

<div id="deadlineBanner"></div>

<nav class="tabs" id="tabNav">
  <button type="button" data-action="show-tab" data-tab="overview" id="tabBtnOverview"></button>
  <button type="button" data-action="show-tab" data-tab="roster" id="tabBtnRoster"></button>
  <button type="button" data-action="show-tab" data-tab="forecast" id="tabBtnForecast"></button>
  <button type="button" data-action="show-tab" data-tab="rules" id="tabBtnRules"></button>
  <button type="button" data-action="show-tab" data-tab="data" id="tabBtnData"></button>
</nav>

<div class="tab-panel" id="tab-overview" data-tab-panel="overview">
  <section id="overviewSection">
    <h2 id="overviewHeading">Overview</h2>
    <p id="overviewDesc"></p>
    <div class="stat-grid" id="overviewStats"></div>
  </section>
</div>

<div class="tab-panel" id="tab-roster" data-tab-panel="roster">
  <section id="rosterSection">
    <h2 id="rosterHeading">Roster</h2>
    <p id="rosterEditHint"></p>
    <div class="table-scroll">
      <table id="rosterTable">
        <thead>
          <tr id="rosterTableHead"><th>Name</th><th>Year</th><th>Points</th><th>Tag</th><th>Claimed</th><th>Northern</th><th></th></tr>
        </thead>
        <tbody id="rosterBody"></tbody>
      </table>
    </div>
    <div class="roster-actions">
      <button type="button" class="primary" id="addHunterBtn" data-action="add-hunter"></button>
    </div>
  </section>
</div>

<div class="tab-panel" id="tab-forecast" data-tab-panel="forecast">
  <section id="targetSection">
    <h2 id="targetHeading">Group Target</h2>
    <p id="targetDesc"></p>
    <div class="panel">
      <div class="target-controls">
        <label><span id="targetWmuLabel">WMU</span> <select id="targetWmu"></select></label>
        <label><span id="targetTypeLabel">Tag type</span> <select id="targetMooseType"></select></label>
        <label><span id="targetSeasonLabel">Season</span> <select id="targetSeason"></select></label>
        <label><span id="targetStageLabel">Stage</span> <select id="targetStage"></select></label>
        <label><span id="targetChoiceLabel">Choice</span> <select id="targetChoice"></select></label>
      </div>
      <p id="targetNoData" class="warning" hidden></p>
    </div>
  </section>

  <section id="forecastSection">
    <h2 id="forecastHeading">Group Staggering Forecast</h2>
    <p id="forecastDesc"></p>
    <div class="table-scroll">
      <table id="forecastTable">
        <thead>
          <tr><th>Year</th><th>Projected cutoff</th><th>Expected tags drawn</th><th>Status</th></tr>
        </thead>
        <tbody id="forecastBody"></tbody>
      </table>
    </div>
  </section>

  <section id="chartSection">
    <h2 id="chartHeading">Points Over Time</h2>
    <p id="chartDesc"></p>
    <div class="panel">
      <div id="pointsChart"></div>
      <div id="chartLegend" class="chart-legend"></div>
    </div>
  </section>
</div>

<div class="tab-panel" id="tab-rules" data-tab-panel="rules">
  <section id="rulesSection">
    <h2 id="rulesHeading">Key Rules</h2>
    <div class="cards" id="rulesCards"></div>
  </section>
</div>

<div class="tab-panel" id="tab-data" data-tab-panel="data">
  <section id="dataSection">
    <h2 id="dataHeading">Data</h2>
    <p id="dataStatus"></p>
    <input type="file" id="rosterUpload" accept=".xlsx">
    <div>
      <a id="templateLink" href="moose-group-points-template.xlsx" download>Download roster template (.xlsx)</a>
      <button type="button" id="exportBtn" data-action="export-roster"></button>
    </div>
  </section>
</div>

  // ---------------------------------------------------------------------
  // getSeasonPhase(today) - deadline-tracker banner logic.
  // ---------------------------------------------------------------------
  function daysBetween(from, to) {
    const msPerDay = 24 * 60 * 60 * 1000;
    const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    const b = new Date(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.round((b - a) / msPerDay);
  }

  function getSeasonPhase(today) {
    const year = today.getFullYear();
    const md = (today.getMonth() + 1) * 100 + today.getDate(); // e.g. Aug 1 -> 801

    if (md >= 101 && md <= 131) {
      const deadline = new Date(year, 0, 31);
      const d = daysBetween(today, deadline);
      return { key: "applicationOpen", daysUntil: d, urgent: d <= 7 };
    }
    if (md >= 201 && md <= 430) {
      const deadline = new Date(year, 3, 30);
      const d = daysBetween(today, deadline);
      return { key: "applicationClosed", daysUntil: d, urgent: false };
    }
    if (md >= 501 && md <= 531) {
      const deadline = new Date(year, 4, 31);
      const d = daysBetween(today, deadline);
      return { key: "drawResults", daysUntil: d, urgent: false };
    }
    if (md >= 601 && md <= 731) {
      const deadline = new Date(year, 6, 31);
      const d = daysBetween(today, deadline);
      return { key: "secondChanceOpen", daysUntil: d, urgent: d <= 7 };
    }

    // Aug 1 - Nov 15 window: this is where the confirmed 2027 allocation
    // changes (ERO 019-7813) branch the logic. Pre-2027 seasons keep the
    // original single secondChanceClaim phase running to ~Dec 15; 2027+
    // seasons split this span into the advanced claim window plus the new
    // Last Chance Allocation stage, both with dates still TBD from MNR.
    if (md >= 801 && md <= 1115) {
      if (year < 2027) {
        const deadline = new Date(year, 11, 15);
        const d = daysBetween(today, deadline);
        return { key: "secondChanceClaim", daysUntil: d, urgent: d <= 14 };
      }

      if (md >= 801 && md <= 831) {
        return { key: "secondChanceClaimAdvanced", daysUntil: null, urgent: true };
      }
      if (md >= 901 && md <= 914) {
        const deadline = new Date(year, 8, 15);
        const d = daysBetween(today, deadline);
        return { key: "lastChanceUpcoming", daysUntil: d, urgent: d <= 7 };
      }
      // Sep 15 - Nov 15
      return { key: "lastChance", daysUntil: null, urgent: false };
    }

    if (md >= 1116 && md <= 1215) {
      const deadline = new Date(year, 11, 15);
      const d = daysBetween(today, deadline);
      return { key: "seasonActive", daysUntil: d, urgent: d <= 3 };
    }

    // Dec 16 - Dec 31, off season until next application window opens.
    const nextOpen = new Date(year + 1, 0, 1);
    const d = daysBetween(today, nextOpen);
    return { key: "offSeason", daysUntil: d, urgent: false };
  }

  // ---------------------------------------------------------------------
  // computeTimeline - MPR comparison helper. NORTHERN_PREFERENCE_POINT is
  // applied here only, never to a hunter's banked pointsHistory values, and
  // only for hunters whose latest record is flagged northernResident (from
  // the uploaded roster's NorthernResident column) - it does not apply to
  // every hunter by default.
  // ---------------------------------------------------------------------
  function latestEntry(hunter) {
    const history = hunter.pointsHistory;
    if (!history || history.length === 0) return null;
    return history[history.length - 1];
  }

  function bankedPoints(hunter) {
    const entry = latestEntry(hunter);
    return entry ? entry.points : 0;
  }

  function isNorthernResident(hunter) {
    const entry = latestEntry(hunter);
    return !!(entry && entry.northernResident);
  }

  function computeTimeline(hunters) {
    return hunters
      .map((hunter) => {
        const banked = bankedPoints(hunter);
        const bonus = isNorthernResident(hunter) ? NORTHERN_PREFERENCE_POINT : 0;
        return { name: hunter.name, banked, mpr: banked + bonus };
      })
      .sort((a, b) => b.mpr - a.mpr);
  }

/calf":{"Bow":{"Primary":{"1":[[2021,3],[2022,7],[2023,6],[2024,8],[2025,7]]},"Second Chance":{"1":[[2024,11],[2025,9]]}},"Gun":{"Primary":{"1":[[2021,19],[2022,15],[2023,15],[2024,15],[2025,14]]},"Second Chance":{"1":[[2022,16],[2023,14],[2025,13]]}}}},"65":{"Bull":{"Bow":{"Primary":{"1":[[2021,8],[2022,6],[2023,6],[2024,6],[2025,6]]},"Second Chance":{"1":[[2021,7],[2022,5],[2023,5],[2024,7],[2025,6]]}}},"Calf":{"All Seasons":{"Primary":{"1":[[2021,1],[2022,0],[2023,1],[2024,1],[2025,1]]},"Second Chance":{"1":[[2021,1],[2022,0],[2023,1],[2024,2],[2025,0]]}}},"Cow/calf":{"Bow":{"Primary":{"1":[[2021,3],[2022,3],[2023,2],[2024,2],[2025,2]]},"Second Chance":{"1":[[2021,2],[2022,2],[2023,2],[2024,2],[2025,2]]}}}}};

  function sortedKeys(obj) {
    return Object.keys(obj).sort((a, b) => {
      const na = Number(a), nb = Number(b);
      if (!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
      return a.localeCompare(b);
    });
  }

  function availableWMUs() {
    return sortedKeys(MOOSE_TRENDS);
  }

  function availableMooseTypes(wmu) {
    return MOOSE_TRENDS[wmu] ? sortedKeys(MOOSE_TRENDS[wmu]) : [];
  }

  function availableSeasons(wmu, mooseType) {
    return MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] ? sortedKeys(MOOSE_TRENDS[wmu][mooseType]) : [];
  }

  function availableStages(wmu, mooseType, season) {
    const node = MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] && MOOSE_TRENDS[wmu][mooseType][season];
    return node ? sortedKeys(node) : [];
  }

  function availableChoices(wmu, mooseType, season, stage) {
    const seasonNode = MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] && MOOSE_TRENDS[wmu][mooseType][season];
    const node = seasonNode && seasonNode[stage];
    return node ? sortedKeys(node) : [];
  }

  function getTrendSeries(target) {
    if (!target) return null;
    const node =
      MOOSE_TRENDS[target.wmu] &&
      MOOSE_TRENDS[target.wmu][target.mooseType] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season][target.stage] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season][target.stage][target.choice];
    if (!node) return null;
    return node.map(([year, cutoff]) => ({ year, cutoff }));
  }

  const DEFAULT_GROUP_TARGET = { wmu: "24", mooseType: "Bull", season: "Gun", stage: "Primary", choice: "1" };

  // ---------------------------------------------------------------------
  // Forecast engine - replaces a flat, hand-set MPR guess with a cutoff
  // trend fitted to the group's chosen target's real MOOSE_TRENDS series
  // and a probability ramp instead of a hard pass/fail threshold, since
  // the real data shows partial award rates right around the cutoff
  // rather than a clean cliff.
  // ---------------------------------------------------------------------
  function linearRegression(points) {
    const n = points.length;
    const sumX = points.reduce((s, p) => s + p.x, 0);
    const sumY = points.reduce((s, p) => s + p.y, 0);
    const sumXY = points.reduce((s, p) => s + p.x * p.y, 0);
    const sumXX = points.reduce((s, p) => s + p.x * p.x, 0);
    const denom = n * sumXX - sumX * sumX;
    const slope = denom === 0 ? 0 : (n * sumXY - sumX * sumY) / denom;
    const intercept = (sumY - slope * sumX) / n;
    return { slope, intercept };
  }

  function projectCutoff(trend, targetYear) {
    const points = trend.map((p) => ({ x: p.year, y: p.cutoff }));
    const { slope, intercept } = linearRegression(points);
    return slope * targetYear + intercept;
  }

  // Full award at/above cutoff, zero two points below it, linear ramp
  // between - a smoothed stand-in for the partial-award brackets seen in
  // the real per-year data (e.g. 5%, 36%, 73% at the bracket just under a
  // given year's cutoff), since simulating those exactly would need a
  // cutoff-bracket table for every future year rather than just a trend.
  function drawProbability(points, cutoff) {
    if (points >= cutoff) return 1;
    if (points <= cutoff - 2) return 0;
    return (points - (cutoff - 2)) / 2;
  }

  function projectedPoints(hunter, year, startYear) {
    return bankedPoints(hunter) + Math.max(0, year - startYear);
  }

  function effectivePoints(hunter, year, startYear) {
    const bonus = isNorthernResident(hunter) ? NORTHERN_PREFERENCE_POINT : 0;
    return projectedPoints(hunter, year, startYear) + bonus;
  }

  function buildHunterForecast(hunter, startYear, endYear, trend) {
    const results = [];
    for (let year = startYear; year <= endYear; year++) {
      const cutoff = projectCutoff(trend, year);
      results.push({
        year,
        points: projectedPoints(hunter, year, startYear),
        cutoff: Math.round(cutoff * 10) / 10,
        probability: drawProbability(effectivePoints(hunter, year, startYear), cutoff)
      });
    }
    return results;
  }

  function computeGroupStaggering(hunters, startYear, endYear, trend) {
    const perYear = [];
    for (let year = startYear; year <= endYear; year++) {
      const cutoff = projectCutoff(trend, year);
      const expected = hunters.reduce(
        (sum, hunter) => sum + drawProbability(effectivePoints(hunter, year, startYear), cutoff),
        0
      );
      let status = "ok";
      if (expected < 0.4) status = "gap";
      else if (expected > 1.2) status = "stacked";
      perYear.push({ year, cutoff: Math.round(cutoff * 10) / 10, expected: Math.round(expected * 100) / 100, status });
    }
    return perYear;
  }

  // ---------------------------------------------------------------------
  // parseRosterRows - turns flat spreadsheet rows (one row per hunter per
  // year, as read from the roster .xlsx template - Hunter/Year/Points/
  // TagType/Claimed/WMU/Season/MooseType/NorthernResident) into the
  // HUNTER_SEED-shaped roster this app renders and computes from. This is
  // the general-purpose ingestion path: any group's filled-in template
  // produces a roster the same way, regardless of who uploads it.
  // ---------------------------------------------------------------------
  function truthyFlag(value) {
    if (typeof value === "string") return value.trim().toUpperCase() === "Y";
    return !!value;
  }

  function parseRosterRows(rows) {
    const byHunter = new Map();
    (rows || []).forEach((row) => {
      const name = String(row.Hunter || row.hunter || "").trim();
      const year = Number(row.Year ?? row.year);
      const points = Number(row.Points ?? row.points);
      if (!name || !Number.isFinite(year) || !Number.isFinite(points)) return;

      const entry = {
        year,
        points,
        tagType: row.TagType || row.tagType || null,
        claimed: truthyFlag(row.Claimed ?? row.claimed),
        wmu: row.WMU || row.wmu || null,
        season: row.Season || row.season || null,
        mooseType: row.MooseType || row.mooseType || null,
        northernResident: truthyFlag(row.NorthernResident ?? row.northernResident)
      };

      if (!byHunter.has(name)) byHunter.set(name, []);
      byHunter.get(name).push(entry);
    });

    const roster = [];
    byHunter.forEach((pointsHistory, name) => {
      pointsHistory.sort((a, b) => a.year - b.year);
      roster.push({ name, pointsHistory });
    });
    roster.sort((a, b) => a.name.localeCompare(b.name));
    return roster;
  }

  // rosterToRows - the inverse of parseRosterRows, so edits made in-browser
  // can be exported back out as the same flat template shape for re-upload
  // or hand-off to another tool.
  function rosterToRows(roster) {
    const rows = [];
    (roster || []).forEach((hunter) => {
      hunter.pointsHistory.forEach((entry) => {
        rows.push({
          Hunter: hunter.name,
          Year: entry.year,
          Points: entry.points,
          TagType: entry.tagType || "",
          Claimed: entry.claimed ? "Y" : "N",
          WMU: entry.wmu || "",
          Season: entry.season || "",
          MooseType: entry.mooseType || "",
          NorthernResident: entry.northernResident ? "Y" : "N"
        });
      });
    });
    return rows;
  }

  // buildPointsSeries - one {year, points} series per hunter, real history
  // up to the current year plus the same forward projection the forecast
  // engine uses (banked points +1/year), for the points-over-time chart.
  function buildPointsSeries(roster, startYear, endYear) {
    return (roster || []).map((hunter) => {
      const history = (hunter.pointsHistory || []).slice().sort((a, b) => a.year - b.year);
      const points = [];
      history.forEach((entry) => {
        if (entry.year <= startYear) points.push({ year: entry.year, points: entry.points });
      });
      for (let year = startYear; year <= endYear; year++) {
        points.push({ year, points: projectedPoints(hunter, year, startYear) });
      }
      return { name: hunter.name, points };
    });
  }

  // ---------------------------------------------------------------------
  // Persistence - localStorage only, per browser, no accounts/server. A
  // roster the user uploaded (and any in-browser edits since) survives
  // reloads; the demo HUNTER_SEED data is never persisted.
  // ---------------------------------------------------------------------
  const STORAGE_KEY = "mooseTrackerState_v1";

  function loadPersistedState() {
    try {
      if (typeof localStorage === "undefined") return null;
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function persistState() {
    try {
      if (typeof localStorage === "undefined") return;
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          roster: activeRosterIsUploaded ? activeRoster : null,
          target: groupTarget
        })
      );
    } catch (e) {
      // ignore quota / private-browsing errors - the app still works, just unsaved
    }
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  const RULE_KEYS = ["ruleLicence", "ruleRadius", "ruleKill", "ruleNotch", "ruleReport", "ruleWatch", "ruleAllocation2027"];

  function renderRules() {
    const container = document.getElementById("rulesCards");
    if (!container) return;
    container.innerHTML = "";
    RULE_KEYS.forEach((key) => {
      const rule = I18N[currentLang][key];
      if (!rule) return;
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.rule = key;
      const h = document.createElement("h3");
      h.textContent = rule.h;
      const p = document.createElement("p");
      p.textContent = rule.p;
      card.appendChild(h);
      card.appendChild(p);
      container.appendChild(card);
    });
  }

  let activeRoster = HUNTER_SEED;
  let activeRosterIsUploaded = false;
  let groupTarget = Object.assign({}, DEFAULT_GROUP_TARGET);

  (function restorePersistedState() {
    const saved = loadPersistedState();
    if (!saved) return;
    if (saved.roster && Array.isArray(saved.roster) && saved.roster.length > 0) {
      activeRoster = saved.roster;
      activeRosterIsUploaded = true;
    }
    if (saved.target && getTrendSeries(saved.target)) {
      groupTarget = saved.target;
    }
  })();

  function setGroupTarget(next) {
    groupTarget = Object.assign({}, groupTarget, next);
    persistState();
    render();
  }

  function findHunter(name) {
    return activeRoster.find((h) => h.name === name);
  }

  function markEditedAndPersist() {
    activeRosterIsUploaded = true;
    persistState();
    render();
  }

  function updateEntryField(hunterName, idx, field, value) {
    const hunter = findHunter(hunterName);
    const entry = hunter && hunter.pointsHistory[idx];
    if (!entry) return;
    if (field === "year" || field === "points") {
      const n = Number(value);
      if (Number.isFinite(n)) entry[field] = n;
    } else if (field === "claimed" || field === "northernResident") {
      entry[field] = !!value;
    } else if (field === "tagType") {
      entry.tagType = value ? value : null;
    }
    hunter.pointsHistory.sort((a, b) => a.year - b.year);
    markEditedAndPersist();
  }

  function addYearForHunter(hunterName) {
    const hunter = findHunter(hunterName);
    if (!hunter) return;
    const lastYear = hunter.pointsHistory.length
      ? hunter.pointsHistory[hunter.pointsHistory.length - 1].year
      : new Date().getFullYear();
    hunter.pointsHistory.push({
      year: lastYear + 1,
      points: 0,
      tagType: null,
      claimed: false,
      northernResident: false,
      wmu: null,
      season: null,
      mooseType: null
    });
    markEditedAndPersist();
  }

  function deleteEntry(hunterName, idx) {
    const hunter = findHunter(hunterName);
    if (!hunter) return;
    hunter.pointsHistory.splice(idx, 1);
    markEditedAndPersist();
  }

  function addHunterNamed(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    activeRoster = activeRoster.concat([
      {
        name: trimmed,
        pointsHistory: [
          {
            year: new Date().getFullYear(),
            points: 0,
            tagType: null,
            claimed: false,
            northernResident: false,
            wmu: null,
            season: null,
            mooseType: null
          }
        ]
      }
    ]);
    markEditedAndPersist();
  }

  function addHunter() {
    if (typeof prompt !== "function") return;
    addHunterNamed(prompt(t("addHunterPrompt")));
  }

  function makeEditInput(type, value, hunterName, idx, field) {
    const input = document.createElement("input");
    input.type = type;
    if (type === "checkbox") input.checked = !!value;
    else input.value = value == null ? "" : value;
    input.dataset.action = "edit-entry";
    input.dataset.name = hunterName;
    input.dataset.idx = String(idx);
    input.dataset.field = field;
    return input;
  }

  function renderRoster() {
    const body = document.getElementById("rosterBody");
    if (!body) return;
    const hint = document.getElementById("rosterEditHint");
    if (hint) hint.textContent = t("rosterEditHint");
    const addBtn = document.getElementById("addHunterBtn");
    if (addBtn) addBtn.textContent = t("addHunterBtn");
    const head = document.getElementById("rosterTableHead");
    if (head) {
      const cols = t("table");
      head.innerHTML = `<th>${cols.name}</th><th>${cols.year}</th><th>${cols.points}</th><th>${cols.tag}</th><th>${cols.claimed}</th><th>${cols.northern}</th><th></th>`;
    }

    body.innerHTML = "";
    activeRoster.forEach((hunter) => {
      hunter.pointsHistory.forEach((entry, idx) => {
        const tr = document.createElement("tr");
        const nameCell = document.createElement("td");
        nameCell.textContent = hunter.name;
        const yearCell = document.createElement("td");
        yearCell.textContent = entry.year;
        const pointsCell = document.createElement("td");
        pointsCell.appendChild(makeEditInput("number", entry.points, hunter.name, idx, "points"));
        const tagCell = document.createElement("td");
        tagCell.appendChild(makeEditInput("text", entry.tagType || "", hunter.name, idx, "tagType"));
        const claimedCell = document.createElement("td");
        claimedCell.appendChild(makeEditInput("checkbox", entry.claimed, hunter.name, idx, "claimed"));
        const northernCell = document.createElement("td");
        northernCell.appendChild(makeEditInput("checkbox", entry.northernResident, hunter.name, idx, "northernResident"));
        const actionsCell = document.createElement("td");
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.textContent = "×";
        delBtn.dataset.action = "delete-entry";
        delBtn.dataset.name = hunter.name;
        delBtn.dataset.idx = String(idx);
        actionsCell.appendChild(delBtn);

        tr.append(nameCell, yearCell, pointsCell, tagCell, claimedCell, northernCell, actionsCell);
        body.appendChild(tr);
      });

      const addRow = document.createElement("tr");
      const addCell = document.createElement("td");
      addCell.colSpan = 7;
      const addYearBtn = document.createElement("button");
      addYearBtn.type = "button";
      addYearBtn.textContent = t("addYearBtn");
      addYearBtn.dataset.action = "add-year";
      addYearBtn.dataset.name = hunter.name;
      addCell.appendChild(addYearBtn);
      addRow.appendChild(addCell);
      body.appendChild(addRow);
    });
  }

    const banner = document.getElementById("deadlineBanner");
    if (!banner) return;
    const phase = getSeasonPhase(new Date());
    banner.textContent = t("deadline." + phase.key, phase.daysUntil);

    };

  const FORECAST_SPAN_YEARS = 7; // years shown beyond the current year

  function renderTargetSelector() {
    const wmuSel = document.getElementById("targetWmu");
    if (!wmuSel) return;
    const heading = document.getElementById("targetHeading");
    if (heading) heading.textContent = t("targetHeading");
    const desc = document.getElementById("targetDesc");
    if (desc) desc.textContent = t("targetDesc");
    const setLabel = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.textContent = t(key);
    };
    setLabel("targetWmuLabel", "targetWmuLabel");
    setLabel("targetTypeLabel", "targetTypeLabel");
    setLabel("targetSeasonLabel", "targetSeasonLabel");
    setLabel("targetStageLabel", "targetStageLabel");
    setLabel("targetChoiceLabel", "targetChoiceLabel");

    function fillSelect(select, options, current) {
      select.innerHTML = "";
      options.forEach((opt) => {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        select.appendChild(o);
      });
      if (options.includes(current)) select.value = current;
    }

    const wmus = availableWMUs();
    fillSelect(wmuSel, wmus, groupTarget.wmu);
    const typeSel = document.getElementById("targetMooseType");
    fillSelect(typeSel, availableMooseTypes(groupTarget.wmu), groupTarget.mooseType);
    const seasonSel = document.getElementById("targetSeason");
    fillSelect(seasonSel, availableSeasons(groupTarget.wmu, groupTarget.mooseType), groupTarget.season);
    const stageSel = document.getElementById("targetStage");
    fillSelect(stageSel, availableStages(groupTarget.wmu, groupTarget.mooseType, groupTarget.season), groupTarget.stage);
    const choiceSel = document.getElementById("targetChoice");
    fillSelect(
      choiceSel,
      availableChoices(groupTarget.wmu, groupTarget.mooseType, groupTarget.season, groupTarget.stage),
      groupTarget.choice
    );

    const warning = document.getElementById("targetNoData");
    if (warning) {
      const hasData = !!getTrendSeries(groupTarget);
      warning.hidden = hasData;
      if (!hasData) warning.textContent = t("targetNoData");
    }
  }

  function handleTargetFieldChange(field, value) {
    const next = Object.assign({}, groupTarget, { [field]: value });
    // Cascade: changing an upstream field resets everything downstream to
    // its first available option, since the old choice may no longer exist
    // for the new WMU/type/season/stage combination.
    if (field === "wmu") {
      next.mooseType = availableMooseTypes(next.wmu)[0];
      next.season = availableSeasons(next.wmu, next.mooseType)[0];
      next.stage = availableStages(next.wmu, next.mooseType, next.season)[0];
      next.choice = availableChoices(next.wmu, next.mooseType, next.season, next.stage)[0];
    } else if (field === "mooseType") {
      next.season = availableSeasons(next.wmu, next.mooseType)[0];
      next.stage = availableStages(next.wmu, next.mooseType, next.season)[0];
      next.choice = availableChoices(next.wmu, next.mooseType, next.season, next.stage)[0];
    } else if (field === "season") {
      next.stage = availableStages(next.wmu, next.mooseType, next.season)[0];
      next.choice = availableChoices(next.wmu, next.mooseType, next.season, next.stage)[0];
    } else if (field === "stage") {
      next.choice = availableChoices(next.wmu, next.mooseType, next.season, next.stage)[0];
    }
    setGroupTarget(next);
  }

  function renderForecast() {
    const body = document.getElementById("forecastBody");
    if (!body) return;
    const heading = document.getElementById("forecastHeading");
    if (heading) heading.textContent = t("forecastHeading");
    const desc = document.getElementById("forecastDesc");
    if (desc) desc.textContent = t("forecastDesc");
    const headRow = document.querySelector("#forecastTable thead tr");
    if (headRow) {
      const cols = t("forecastTable");
      headRow.innerHTML = `<th>${cols.year}</th><th>${cols.cutoff}</th><th>${cols.expected}</th><th>${cols.status}</th>`;
    }

    body.innerHTML = "";
    const trend = getTrendSeries(groupTarget);
    if (!trend) return;

    const startYear = new Date().getFullYear();
    const endYear = startYear + FORECAST_SPAN_YEARS;
    const staggering = computeGroupStaggering(activeRoster, startYear, endYear, trend);
    const statusLabel = { gap: t("forecastStatusGap"), ok: t("forecastStatusOk"), stacked: t("forecastStatusStacked") };

    staggering.forEach((row) => {
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + row.year + "</td>" +
        "<td>" + row.cutoff + "</td>" +
        "<td>" + row.expected + "</td>" +
        '<td><span class="pill pill-' + row.status + '">' + statusLabel[row.status] + "</span></td>";
      body.appendChild(tr);
    });
  }

  const HUNTER_COLORS = ["#2a6f97", "#bf5b04", "#2e7d32", "#8e24aa", "#c62828", "#00838f", "#6d4c41", "#616161"];

  function hunterColor(index) {
    return HUNTER_COLORS[index % HUNTER_COLORS.length];
  }

  function renderChart() {
    const container = document.getElementById("pointsChart");
    if (!container) return;
    const heading = document.getElementById("chartHeading");
    if (heading) heading.textContent = t("chartHeading");
    const desc = document.getElementById("chartDesc");
    if (desc) desc.textContent = t("chartDesc");

    const startYear = new Date().getFullYear();
    const endYear = startYear + FORECAST_SPAN_YEARS;
    const series = buildPointsSeries(activeRoster, startYear, endYear);

    const allYears = series.flatMap((s) => s.points.map((p) => p.year));
    const allPoints = series.flatMap((s) => s.points.map((p) => p.points));
    const minYear = allYears.length ? Math.min(...allYears) : startYear;
    const maxYear = allYears.length ? Math.max(...allYears) : endYear;
    const maxPoints = Math.max(1, ...allPoints);

    const padL = 34, padR = 10, padT = 10, padB = 24;
    const yearSpan = Math.max(1, maxYear - minYear);
    const plotW = Math.max(400, yearSpan * 40);
    const plotH = 220;
    const W = plotW + padL + padR;
    const H = plotH + padT + padB;
    const xScale = (year) => padL + ((year - minYear) / yearSpan) * plotW;
    const yScale = (pts) => padT + plotH - (pts / maxPoints) * plotH;

    let grid = "";
    [0, Math.round(maxPoints / 2), maxPoints].forEach((v) => {
      const y = yScale(v).toFixed(1);
      grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="currentColor" stroke-opacity="0.15" />`;
      grid += `<text x="${padL - 6}" y="${Number(y) + 3}" text-anchor="end" font-size="10">${v}</text>`;
    });
    let xLabels = "";
    for (let y = minYear; y <= maxYear; y++) {
      xLabels += `<text x="${xScale(y).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10">${y}</text>`;
    }
    const curX = xScale(startYear).toFixed(1);
    const curLine = `<line x1="${curX}" y1="${padT}" x2="${curX}" y2="${H - padB}" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3,3" />`;

    let paths = "";
    series.forEach((s, i) => {
      if (!s.points.length) return;
      const color = hunterColor(i);
      const d = s.points.map((p, j) => (j === 0 ? "M" : "L") + xScale(p.year).toFixed(1) + " " + yScale(p.points).toFixed(1)).join(" ");
      paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" />`;
      s.points.forEach((p) => {
        paths += `<circle cx="${xScale(p.year).toFixed(1)}" cy="${yScale(p.points).toFixed(1)}" r="2.5" fill="${color}"><title>${s.name} — ${p.year}: ${p.points}</title></circle>`;
      });
    });

    container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${grid}${curLine}${paths}${xLabels}</svg>`;

    const legend = document.getElementById("chartLegend");
    if (legend) {
      legend.innerHTML = series
        .map((s, i) => `<span><i style="background:${hunterColor(i)}"></i>${s.name}</span>`)
        .join("");
    }
  }

  function renderDataStatus() {
    const status = document.getElementById("dataStatus");
    if (status) {
      const count = activeRoster.length;
      status.textContent = activeRosterIsUploaded ? t("dataStatusUploaded", count) : t("dataStatusDemo", count);
    }
    const exportBtn = document.getElementById("exportBtn");
    if (exportBtn) exportBtn.textContent = t("exportBtn");
  }

  // ---------------------------------------------------------------------
  // Tabs - the app used to be one long scroll of unrelated sections
  // (rules, roster, target, chart, forecast, data all stacked). Splitting
  // it into tabs groups related tools together and gives a first, glanceable
  // "Overview" screen instead of making the reader scroll past everything.
  // ---------------------------------------------------------------------
  const TAB_IDS = ["overview", "roster", "forecast", "rules", "data"];
  let activeTab = "overview";

  function showTab(name) {
    if (!TAB_IDS.includes(name)) return;
    activeTab = name;
    renderTabs();
  }

  function renderTabs() {
    const nav = document.getElementById("tabNav");
    if (!nav) return;
    TAB_IDS.forEach((id) => {
      const btn = document.getElementById("tabBtn" + id.charAt(0).toUpperCase() + id.slice(1));
      if (btn) {
        btn.textContent = t("tab" + id.charAt(0).toUpperCase() + id.slice(1));
        btn.classList.toggle("active", id === activeTab);
      }
      const panel = document.getElementById("tab-" + id);
      if (panel) panel.classList.toggle("active", id === activeTab);
    });
  }

  function renderOverview() {
    const heading = document.getElementById("overviewHeading");
    if (heading) heading.textContent = t("overviewHeading");
    const desc = document.getElementById("overviewDesc");
    if (desc) desc.textContent = t("overviewDesc");

    const grid = document.getElementById("overviewStats");
    if (!grid) return;

    const hunterCount = activeRoster.length;
    const target = groupTarget;
    const targetLabel = [target.mooseType, target.season, target.stage].filter(Boolean).join(" · ");
    const trend = getTrendSeries(target);

    const thisYear = new Date().getFullYear();
    let statusPill = "";
    let statusSub = "";
    if (trend) {
      const [row] = computeGroupStaggering(activeRoster, thisYear, thisYear, trend);
      statusPill = '<span class="pill pill-' + row.status + '">' + t("forecastStatus" + row.status.charAt(0).toUpperCase() + row.status.slice(1)) + "</span>";
      statusSub = t("overviewExpected", row.expected);
    } else {
      statusPill = '<span class="pill pill-gap">' + t("targetNoDataShort") + "</span>";
    }

    grid.innerHTML =
      '<div class="stat-card"><div class="stat-label">' + t("overviewStatHunters") + '</div><div class="stat-value">' + hunterCount + "</div><div class=\"stat-sub\">" +
      (activeRosterIsUploaded ? t("dataStatusUploaded", hunterCount) : t("dataStatusDemo", hunterCount)) +
      '</div></div>' +
      '<div class="stat-card"><div class="stat-label">' + t("overviewStatTarget") + '</div><div class="stat-value">' + t("overviewWmuPrefix") + " " + target.wmu + '</div><div class="stat-sub">' + targetLabel + "</div></div>" +
      '<div class="stat-card"><div class="stat-label">' + t("overviewStatThisYear", thisYear) + '</div><div class="stat-value">' + statusPill + '</div><div class="stat-sub">' + statusSub + "</div></div>";
  }

  function render() {
    renderStaticText();
    renderBanner();
    renderRules();
    renderRoster();
    renderTargetSelector();
    renderChart();
    renderForecast();
    renderDataStatus();
    renderOverview();
    renderTabs();
    const toggle = document.getElementById("langToggle");
    if (toggle) toggle.textContent = currentLang === "en" ? "FR" : "EN";
  }

  function loadRoster(roster) {
    activeRoster = roster;
    activeRosterIsUploaded = true;
    persistState();
    render();
  }

  function handleRosterFile(file) {
    if (!file || typeof XLSX === "undefined") return;
    const status = document.getElementById("dataStatus");
    file
      .arrayBuffer()
      .then((buffer) => {
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheetName =
          workbook.SheetNames.find((n) => /points/i.test(n)) ||
          workbook.SheetNames[workbook.SheetNames.length - 1];
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: null });
        const roster = parseRosterRows(rows);
        if (roster.length === 0) throw new Error("empty roster");
        loadRoster(roster);
      })
      .catch(() => {
        if (status) status.textContent = t("dataStatusError");
      });
  }

  function exportRoster() {
    if (typeof XLSX === "undefined") return;
    const rows = rosterToRows(activeRoster);
    const sheet = XLSX.utils.json_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, "Points Tracker");
    XLSX.writeFile(workbook, "moose-group-points-export.xlsx");
  }

  function setLang(lang) {
    if (lang !== "en" && lang !== "fr") return;
    currentLang = lang;
    render();
  }

  function toggleLang() {
    setLang(currentLang === "en" ? "fr" : "en");
  }

  function handleDelegatedChange(event) {
    const el = event.target;
    if (!el || !el.dataset) return;
    if (el.dataset.action === "edit-entry") {
      const value = el.type === "checkbox" ? el.checked : el.value;
      updateEntryField(el.dataset.name, Number(el.dataset.idx), el.dataset.field, value);
      return;
    }
    const targetFieldMap = {
      targetWmu: "wmu",
      targetMooseType: "mooseType",
      targetSeason: "season",
      targetStage: "stage",
      targetChoice: "choice"
    };
    if (el.id && targetFieldMap[el.id]) {
      handleTargetFieldChange(targetFieldMap[el.id], el.value);
    }
  }

  function handleDelegatedClick(event) {
    const el = event.target.closest && event.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action === "add-year") addYearForHunter(el.dataset.name);
    else if (action === "delete-entry") deleteEntry(el.dataset.name, Number(el.dataset.idx));
    else if (action === "add-hunter") addHunter();
    else if (action === "export-roster") exportRoster();
    else if (action === "show-tab") showTab(el.dataset.tab);
  }

  if (typeof document !== "undefined") {
    document.addEventListener("change", handleDelegatedChange);
    document.addEventListener("click", handleDelegatedClick);
    document.addEventListener("DOMContentLoaded", function () {
      const toggle = document.getElementById("langToggle");
      if (toggle) toggle.addEventListener("click", toggleLang);
      const upload = document.getElementById("rosterUpload");
      if (upload) {
        upload.addEventListener("change", function (event) {
          const file = event.target.files && event.target.files[0];
          handleRosterFile(file);
        });
      }
      render();
    });
  }

  // Expose for tests (jsdom) without affecting the browser UI.
  if (typeof window !== "undefined") {
    window.APP = {
      I18N,
      t,
      setLang,
      showTab,
      getActiveTab: () => activeTab,
      getLang: () => currentLang,
      HUNTER_SEED,
      getSeasonPhase,
      computeTimeline,
      parseRosterRows,
      rosterToRows,
      buildPointsSeries,
      loadRoster,
      getActiveRoster: () => activeRoster,
      isRosterUploaded: () => activeRosterIsUploaded,
      NORTHERN_PREFERENCE_POINT,
      MOOSE_TRENDS,
      DEFAULT_GROUP_TARGET,
      getGroupTarget: () => groupTarget,
      setGroupTarget,
      getTrendSeries,
      availableWMUs,
      availableMooseTypes,
      availableSeasons,
      availableStages,
      availableChoices,
      projectCutoff,
      drawProbability,
      buildHunterForecast,
      computeGroupStaggering,
      updateEntryField,
      addYearForHunter,
      deleteEntry,
      addHunterNamed,
      render
    };
  }
})();
</script>

</div>
</body>
</html>
