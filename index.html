<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moose Group Points Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --surface: #fffdf8;
    --surface-2: #ece6d8;
    --ink: #24201a;
    --ink-dim: #5c5548;
    --line: #ddd4c2;
    --accent: #2f5233;
    --accent-2: #4b7a4e;
    --accent-soft: #dce8dd;
    --amber: #a8641a;
    --amber-soft: #f3e3cc;
    --red: #a2402a;
    --red-soft: #f2ddd4;
    --radius: .7rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191d16;
      --surface: #22261d;
      --surface-2: #2a2f22;
      --ink: #ece7da;
      --ink-dim: #aca690;
      --line: #3a3f30;
      --accent: #7cb885;
      --accent-2: #9bcf9f;
      --accent-soft: #2b3a2c;
      --amber: #d99a4e;
      --amber-soft: #3a2f1c;
      --red: #d97e63;
      --red-soft: #3a2620;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  h2 { font-size: 1.35rem; margin-bottom: .25rem; }
  h3 { font-size: 1.05rem; }
  p { color: var(--ink-dim); }

  header.app-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: .75rem; padding-bottom: 1rem; margin-bottom: .75rem;
    border-bottom: 1px solid var(--line);
  }
  header.app-header h1 { font-size: clamp(1.4rem, 3.5vw, 1.9rem); }
  .header-eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 .15rem; }

  #langToggle {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: .4rem .9rem; font-weight: 600; font-size: .85rem;
  }
  #langToggle:hover { border-color: var(--accent); color: var(--accent); }

  #deadlineBanner {
    padding: .9rem 1.1rem; border-radius: var(--radius); margin: 0 0 1.25rem;
    background: var(--surface); border: 1px solid var(--line);
    font-size: .95rem; font-weight: 500;
    display: flex; align-items: center; gap: .6rem;
  }
  #deadlineBanner::before { content: "\1F4C5"; font-size: 1.1rem; }
  #deadlineBanner.urgent { background: var(--amber-soft); border-color: var(--amber); color: var(--ink); }
  #deadlineBanner.urgent::before { content: "\23F3"; }

  nav.tabs {
    display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--line); padding-bottom: 0;
  }
  nav.tabs button {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--ink-dim); font-family: "Source Sans 3", sans-serif; font-weight: 600;
    font-size: .92rem; padding: .55rem .8rem; cursor: pointer; border-radius: .35rem .35rem 0 0;
  }
  nav.tabs button:hover { color: var(--ink); background: var(--surface-2); }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein .15s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  section { margin-bottom: 2rem; }
  section > p:first-of-type { margin-top: .15rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1rem 1.1rem;
  }
  .card h3 { margin-top: 0; margin-bottom: .35rem; color: var(--accent); }
  .card p { margin: 0; font-size: .9rem; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.1rem 1.2rem; margin-top: .75rem;
  }

  table { width: 100%; border-collapse: collapse; margin-top: .75rem; font-size: .92rem; }
  th, td { border-bottom: 1px solid var(--line); padding: .55rem .6rem; text-align: left; }
  thead th { color: var(--ink-dim); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  tbody tr:hover { background: var(--surface-2); }
  .table-scroll { overflow-x: auto; }

  button {
    cursor: pointer; font-family: inherit; border-radius: .5rem; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: .5rem .9rem; font-weight: 600; font-size: .88rem;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  #dataSection input[type="file"] {
    display: block; margin: .6rem 0; padding: .6rem; border: 1px dashed var(--line);
    border-radius: .5rem; background: var(--surface); width: 100%; max-width: 420px; font-size: .85rem;
  }
  #templateLink { display: inline-block; margin: .5rem .5rem .5rem 0; font-weight: 600; color: var(--accent); }

  .roster-actions { margin-top: .75rem; }
  #rosterTable input[type="number"] { width: 4.5rem; }
  #rosterTable input[type="text"] { width: 7rem; }
  #rosterTable input {
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    border-radius: .35rem; padding: .3rem .45rem; font: inherit; font-size: .88rem;
  }
  #rosterTable input:focus { border-color: var(--accent); outline: none; }
  #rosterTable button[data-action="delete-entry"] {
    width: 1.8rem; height: 1.8rem; padding: 0; line-height: 1; border-radius: .4rem;
  }
  #rosterTable button[data-action="delete-entry"]:hover { border-color: var(--red); color: var(--red); }
  #rosterTable tr td[colspan] button { font-size: .82rem; }

  .target-controls { display: flex; flex-wrap: wrap; gap: .9rem 1.4rem; align-items: center; }
  .target-controls label { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; font-weight: 600; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .04em; }
  .target-controls select {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: .45rem; padding: .4rem .55rem; font: inherit; font-size: .92rem; text-transform: none; letter-spacing: 0;
  }
  .warning {
    color: var(--red); background: var(--red-soft); border: 1px solid var(--red);
    border-radius: .5rem; padding: .6rem .8rem; margin-top: .9rem; font-size: .88rem;
  }

  .chart-legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; margin-top: .75rem; font-size: .85rem; color: var(--ink-dim); }
  .chart-legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .chart-legend i { width: .7rem; height: .7rem; border-radius: 3px; display: inline-block; }
  .chart-legend i.legend-ready { background: var(--accent-soft); border: 1px solid var(--accent); }
  .chart-legend i.legend-current { background: var(--surface-2); border: 1px solid var(--ink-dim); }

  #matrixTable { table-layout: fixed; }
  #matrixTable th, #matrixTable td { text-align: center; padding: .5rem .55rem; white-space: nowrap; }
  #matrixTable th:first-child, #matrixTable td.matrix-name {
    position: sticky; left: 0; background: var(--bg); text-align: left; z-index: 1;
    box-shadow: 1px 0 0 var(--line);
  }
  #matrixTable tbody tr:hover td.matrix-name { background: var(--surface-2); }
  .matrix-name { font-weight: 600; }
  th.matrix-col { font-variant-numeric: tabular-nums; }
  th.matrix-current, td.matrix-current { background: var(--surface-2); }
  td.matrix-cell { font-variant-numeric: tabular-nums; color: var(--ink-dim); }
  td.matrix-actual { color: var(--ink); font-weight: 600; }
  td.matrix-empty { color: var(--line); }
  td.matrix-ready { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: .35rem; }
  .matrix-tag { font-size: .68rem; font-weight: 500; color: var(--amber); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  .matrix-tag-sim { color: var(--accent); }
  .matrix-sequence-tag { background: var(--accent); color: #fff; font-weight: 700; border-radius: .35rem; }
  .matrix-sequence-tag .matrix-tag-sim { color: #fff; }
  .matrix-sort-btn {
    background: none; border: none; padding: 0; margin: 0; font: inherit; font-weight: inherit;
    color: inherit; cursor: pointer; white-space: nowrap;
  }
  .matrix-sort-btn:hover { color: var(--accent); }
  .matrix-sort-btn.active { color: var(--accent); }
  .legend-sequence { background: var(--accent); }

  .empty-state {
    background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 1.4rem; text-align: center; font-size: .92rem; margin-top: .75rem;
  }

  #choiceTable th, #choiceTable td { text-align: left; }
  #choiceTable .choice-label { font-weight: 600; white-space: nowrap; }
  #choiceTable .choice-section-row td {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-dim);
    font-weight: 700; border-bottom: none; padding-top: 1rem;
  }
  #choiceTable select {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: .45rem; padding: .35rem .5rem; font: inherit; font-size: .9rem; min-width: 6rem;
  }
  .choice-nodata { font-size: .78rem; color: var(--red); }

  #probabilityTable td, #probabilityTable th { text-align: center; }
  #probabilityTable td:first-child, #probabilityTable th:first-child { text-align: left; }
  .prob-cell { font-variant-numeric: tabular-nums; font-weight: 700; }
  .prob-high { color: var(--accent); }
  .prob-mid { color: var(--amber); }
  .prob-low { color: var(--red); }

  @media (max-width: 640px) {
    .target-controls { flex-direction: column; align-items: stretch; }
    nav.tabs { overflow-x: auto; flex-wrap: nowrap; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<div class="wrap">

<header class="app-header">
  <div>
    <p class="header-eyebrow">&#x1F98C; Group Points Tracker</p>
    <h1 id="appTitle">Moose Group Points Tracker</h1>
  </div>
  <button id="langToggle" type="button">FR</button>
</header>

<div id="deadlineBanner"></div>

<nav class="tabs" id="tabNav">
  <button type="button" data-action="show-tab" data-tab="overview" id="tabBtnOverview"></button>
  <button type="button" data-action="show-tab" data-tab="roster" id="tabBtnRoster"></button>
  <button type="button" data-action="show-tab" data-tab="rules" id="tabBtnRules"></button>
  <button type="button" data-action="show-tab" data-tab="data" id="tabBtnData"></button>
</nav>

<div class="tab-panel" id="tab-overview" data-tab-panel="overview">
  <section id="targetSection">
    <h2 id="targetHeading">Group Choice</h2>
    <p id="targetDesc"></p>
    <div class="panel">
      <div class="table-scroll">
        <table id="choiceTable">
          <thead>
            <tr id="choiceTableHead"></tr>
          </thead>
          <tbody id="choiceBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="probabilitySection">
    <h2 id="probabilityHeading">Group Draw Probability</h2>
    <p id="probabilityDesc"></p>
    <div class="table-scroll">
      <table id="probabilityTable">
        <thead>
          <tr id="probabilityTableHead"></tr>
        </thead>
        <tbody id="probabilityBody"></tbody>
      </table>
    </div>
  </section>

  <section id="matrixSection">
    <h2 id="matrixHeading">Where The Team Stands</h2>
    <p id="matrixDesc"></p>
    <p id="matrixEmpty" class="empty-state" hidden></p>
    <div class="table-scroll" id="matrixWrap">
      <table id="matrixTable">
        <thead>
          <tr id="matrixTableHead"></tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="chart-legend" id="matrixLegend"></div>
  </section>
</div>

<div class="tab-panel" id="tab-roster" data-tab-panel="roster">
  <section id="rosterSection">
    <h2 id="rosterHeading">Roster</h2>
    <p id="rosterEditHint"></p>
    <p id="rosterEmpty" class="empty-state" hidden></p>
    <div class="table-scroll" id="rosterWrap">
      <table id="rosterTable">
        <thead>
          <tr id="rosterTableHead"><th>Name</th><th>Year</th><th>Points</th><th>Tag</th><th>Claimed</th><th>Northern</th><th></th></tr>
        </thead>
        <tbody id="rosterBody"></tbody>
      </table>
    </div>
    <div class="roster-actions">
      <button type="button" class="primary" id="addHunterBtn" data-action="add-hunter"></button>
    </div>
  </section>
</div>

<div class="tab-panel" id="tab-rules" data-tab-panel="rules">
  <section id="rulesSection">
    <h2 id="rulesHeading">Key Rules</h2>
    <div class="cards" id="rulesCards"></div>
  </section>
</div>

<div class="tab-panel" id="tab-data" data-tab-panel="data">
  <section id="dataSection">
    <h2 id="dataHeading">Data</h2>
    <p id="dataStatus"></p>
    <input type="file" id="rosterUpload" accept=".xlsx">
    <div>
      <a id="templateLink" href="moose-group-points-template.xlsx" download>Download roster template (.xlsx)</a>
      <button type="button" id="exportBtn" data-action="export-roster"></button>
    </div>
  </section>
</div>

    if (typeof val === "function") return val(...args);

  // ---------------------------------------------------------------------
  // getSeasonPhase(today) - deadline-tracker banner logic.
  // ---------------------------------------------------------------------
  function daysBetween(from, to) {
    const msPerDay = 24 * 60 * 60 * 1000;
    const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    const b = new Date(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.round((b - a) / msPerDay);
  }

  function getSeasonPhase(today) {
    const year = today.getFullYear();
    const md = (today.getMonth() + 1) * 100 + today.getDate(); // e.g. Aug 1 -> 801

    if (md >= 101 && md <= 131) {
      const deadline = new Date(year, 0, 31);
      const d = daysBetween(today, deadline);
      return { key: "applicationOpen", daysUntil: d, urgent: d <= 7 };
    }
    if (md >= 201 && md <= 430) {
      const deadline = new Date(year, 3, 30);
      const d = daysBetween(today, deadline);
      return { key: "applicationClosed", daysUntil: d, urgent: false };
    }
    if (md >= 501 && md <= 531) {
      const deadline = new Date(year, 4, 31);
      const d = daysBetween(today, deadline);
      return { key: "drawResults", daysUntil: d, urgent: false };
    }
    if (md >= 601 && md <= 731) {
      const deadline = new Date(year, 6, 31);
      const d = daysBetween(today, deadline);
      return { key: "secondChanceOpen", daysUntil: d, urgent: d <= 7 };
    }

    // Aug 1 - Nov 15 window: this is where the confirmed 2027 allocation
    // changes (ERO 019-7813) branch the logic. Pre-2027 seasons keep the
    // original single secondChanceClaim phase running to ~Dec 15; 2027+
    // seasons split this span into the advanced claim window plus the new
    // Last Chance Allocation stage, both with dates still TBD from MNR.
    if (md >= 801 && md <= 1115) {
      if (year < 2027) {
        const deadline = new Date(year, 11, 15);
        const d = daysBetween(today, deadline);
        return { key: "secondChanceClaim", daysUntil: d, urgent: d <= 14 };
      }

      if (md >= 801 && md <= 831) {
        return { key: "secondChanceClaimAdvanced", daysUntil: null, urgent: true };
      }
      if (md >= 901 && md <= 914) {
        const deadline = new Date(year, 8, 15);
        const d = daysBetween(today, deadline);
        return { key: "lastChanceUpcoming", daysUntil: d, urgent: d <= 7 };
      }
      // Sep 15 - Nov 15
      return { key: "lastChance", daysUntil: null, urgent: false };
    }

    if (md >= 1116 && md <= 1215) {
      const deadline = new Date(year, 11, 15);
      const d = daysBetween(today, deadline);
      return { key: "seasonActive", daysUntil: d, urgent: d <= 3 };
    }

    // Dec 16 - Dec 31, off season until next application window opens.
    const nextOpen = new Date(year + 1, 0, 1);
    const d = daysBetween(today, nextOpen);
    return { key: "offSeason", daysUntil: d, urgent: false };
  }

  // ---------------------------------------------------------------------
  // computeTimeline - MPR comparison helper. NORTHERN_PREFERENCE_POINT is
  // applied here only, never to a hunter's banked pointsHistory values, and
  // only for hunters whose latest record is flagged northernResident (from
  // the uploaded roster's NorthernResident column) - it does not apply to
  // every hunter by default.
  // ---------------------------------------------------------------------
  function latestEntry(hunter) {
    const history = hunter.pointsHistory;
    if (!history || history.length === 0) return null;
    return history[history.length - 1];
  }

  function bankedPoints(hunter) {
    const entry = latestEntry(hunter);
    return entry ? entry.points : 0;
  }

  // pointsGoingForward - a hunter's real starting point for anything
  // projected beyond their latest recorded row. Matches the same
  // convention the roster template itself uses (a claimed tag's points
  // value is the balance THAT year, and the reset shows up as 0 in the
  // hunter's own next row): if the latest row already claimed a tag, the
  // points going into the next year are 0, not that row's own points
  // value - a claimed tag resets points the year after, whether that
  // reset was typed into the spreadsheet or has to be inferred because
  // the spreadsheet's history simply ends there.
  function pointsGoingForward(hunter) {
    const entry = latestEntry(hunter);
    if (!entry) return 0;
    return entry.claimed ? 0 : entry.points;
  }

  function isNorthernResident(hunter) {
    const entry = latestEntry(hunter);
    return !!(entry && entry.northernResident);
  }

  function computeTimeline(hunters) {
    return hunters
      .map((hunter) => {
        const banked = bankedPoints(hunter);
        const bonus = isNorthernResident(hunter) ? NORTHERN_PREFERENCE_POINT : 0;
        return { name: hunter.name, banked, mpr: banked + bonus };
      })
      .sort((a, b) => b.mpr - a.mpr);
  }

  function sortedKeys(obj) {
    return Object.keys(obj).sort((a, b) => {
      const na = Number(a), nb = Number(b);
      if (!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
      return a.localeCompare(b);
    });
  }

  function availableWMUs() {
    return sortedKeys(MOOSE_TRENDS);
  }

  function availableMooseTypes(wmu) {
    return MOOSE_TRENDS[wmu] ? sortedKeys(MOOSE_TRENDS[wmu]) : [];
  }

  function availableSeasons(wmu, mooseType) {
    return MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] ? sortedKeys(MOOSE_TRENDS[wmu][mooseType]) : [];
  }

  function availableStages(wmu, mooseType, season) {
    const node = MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] && MOOSE_TRENDS[wmu][mooseType][season];
    return node ? sortedKeys(node) : [];
  }

  function availableChoices(wmu, mooseType, season, stage) {
    const seasonNode = MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] && MOOSE_TRENDS[wmu][mooseType][season];
    const node = seasonNode && seasonNode[stage];
    return node ? sortedKeys(node) : [];
  }

  function getTrendSeries(target) {
    if (!target) return null;
    const node =
      MOOSE_TRENDS[target.wmu] &&
      MOOSE_TRENDS[target.wmu][target.mooseType] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season][target.stage] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season][target.stage][target.choice];
    if (!node) return null;
    return node.map(([year, cutoff]) => ({ year, cutoff }));
  }

  // ---------------------------------------------------------------------
  // Group Choice - the whole team is assumed to apply with the same
  // strategy, matching Ontario's real draw form: up to 3 ranked WMU/type/
  // season choices for Primary and up to 3 for Second Chance. A slot is
  // null until the group fills it in; only filled slots count toward the
  // forecast.
  // ---------------------------------------------------------------------
  const DEFAULT_GROUP_CHOICE = {
    primary: [{ wmu: "24", mooseType: "Bull", season: "Gun" }, null, null],
    secondChance: [null, null, null]
  };

  function isValidGroupChoice(value) {
    return (
      value &&
      Array.isArray(value.primary) &&
      value.primary.length === 3 &&
      Array.isArray(value.secondChance) &&
      value.secondChance.length === 3
    );
  }

  // ---------------------------------------------------------------------
  // Forecast engine - replaces a flat, hand-set MPR guess with a cutoff
  // trend fitted to the group's chosen target's real MOOSE_TRENDS series
  // and a probability ramp instead of a hard pass/fail threshold, since
  // the real data shows partial award rates right around the cutoff
  // rather than a clean cliff.
  // ---------------------------------------------------------------------
  function linearRegression(points) {
    const n = points.length;
    const sumX = points.reduce((s, p) => s + p.x, 0);
    const sumY = points.reduce((s, p) => s + p.y, 0);
    const sumXY = points.reduce((s, p) => s + p.x * p.y, 0);
    const sumXX = points.reduce((s, p) => s + p.x * p.x, 0);
    const denom = n * sumXX - sumX * sumX;
    const slope = denom === 0 ? 0 : (n * sumXY - sumX * sumY) / denom;
    const intercept = (sumY - slope * sumX) / n;
    return { slope, intercept };
  }

  function projectCutoff(trend, targetYear) {
    const points = trend.map((p) => ({ x: p.year, y: p.cutoff }));
    const { slope, intercept } = linearRegression(points);
    return slope * targetYear + intercept;
  }

  // Full award at/above cutoff, zero two points below it, linear ramp
  // between - a smoothed stand-in for the partial-award brackets seen in
  // the real per-year data (e.g. 5%, 36%, 73% at the bracket just under a
  // given year's cutoff), since simulating those exactly would need a
  // cutoff-bracket table for every future year rather than just a trend.
  function drawProbability(points, cutoff) {
    if (points >= cutoff) return 1;
    if (points <= cutoff - 2) return 0;
    return (points - (cutoff - 2)) / 2;
  }

  function projectedPoints(hunter, year, startYear) {
    return bankedPoints(hunter) + Math.max(0, year - startYear);
  }

  function effectivePoints(hunter, year, startYear) {
    const bonus = isNorthernResident(hunter) ? NORTHERN_PREFERENCE_POINT : 0;
    return projectedPoints(hunter, year, startYear) + bonus;
  }

  function buildHunterForecast(hunter, startYear, endYear, trend) {
    const results = [];
    for (let year = startYear; year <= endYear; year++) {
      const cutoff = projectCutoff(trend, year);
      results.push({
        year,
        points: projectedPoints(hunter, year, startYear),
        cutoff: Math.round(cutoff * 10) / 10,
        probability: drawProbability(effectivePoints(hunter, year, startYear), cutoff)
      });
    }
    return results;
  }

  function computeGroupStaggering(hunters, startYear, endYear, trend) {
    const perYear = [];
    for (let year = startYear; year <= endYear; year++) {
      const cutoff = projectCutoff(trend, year);
      const expected = hunters.reduce(
        (sum, hunter) => sum + drawProbability(effectivePoints(hunter, year, startYear), cutoff),
        0
      );
      let status = "ok";
      if (expected < 0.4) status = "gap";
      else if (expected > 1.2) status = "stacked";
      perYear.push({ year, cutoff: Math.round(cutoff * 10) / 10, expected: Math.round(expected * 100) / 100, status });
    }
    return perYear;
  }

  // ---------------------------------------------------------------------
  // Combined-slot probability - a hunter (or the group) draws a tag that
  // year if ANY filled Group Choice slot comes through, so slots combine
  // as an OR: 1 - the chance every filled slot misses. Slots are treated
  // as independent draws, which is the same simplifying assumption the
  // single-target forecast already made per slot - real allocation runs
  // choices in sequence rather than fully independently, but there's no
  // per-hunter joint data to model the dependency, and it only matters
  // when multiple slots would otherwise both be near-certain.
  // ---------------------------------------------------------------------
  function collectChoiceSlots(groupChoice) {
    if (!groupChoice) return [];
    const list = [];
    (groupChoice.primary || []).forEach((slot, i) => {
      if (slot && slot.wmu) list.push({ stage: "Primary", choice: String(i + 1), slot });
    });
    (groupChoice.secondChance || []).forEach((slot, i) => {
      if (slot && slot.wmu) list.push({ stage: "Second Chance", choice: String(i + 1), slot });
    });
    return list;
  }

  function slotTrend(entry) {
    return getTrendSeries({
      wmu: entry.slot.wmu,
      mooseType: entry.slot.mooseType,
      season: entry.slot.season,
      stage: entry.stage,
      choice: entry.choice
    });
  }

  function hunterProjectedPointsAtYear(hunter, year) {
    const entry = (hunter.pointsHistory || []).find((e) => e.year === year);
    if (entry) return entry.points;
    const last = latestEntry(hunter);
    if (last && year > last.year) return projectedPoints(hunter, year, last.year);
    return null;
  }

  // Combined probability of drawing a tag that year given an explicit
  // points total (already including any Northern bonus), via any filled
  // Group Choice slot. This is the shared math hunterCombinedProbability()
  // and the matrix simulation both build on - the matrix needs to evaluate
  // it against simulated (post-reset) points, not just a hunter's naive
  // banked-points-plus-years-elapsed projection.
  function combinedProbabilityForPoints(effectivePoints, year, groupChoice) {
    const slots = collectChoiceSlots(groupChoice);
    if (!slots.length) return null;
    let missAll = 1;
    let any = false;
    slots.forEach((entry) => {
      const trend = slotTrend(entry);
      if (!trend) return;
      any = true;
      const cutoff = projectCutoff(trend, year);
      missAll *= 1 - drawProbability(effectivePoints, cutoff);
    });
    return any ? 1 - missAll : null;
  }

  // Probability a single hunter draws a tag that year via any filled slot.
  // Returns null (not 0) when there's nothing to compute from - no filled
  // slots, no resolvable trend for any of them, or no known/projectable
  // points for that hunter that year - so callers can tell "no data" apart
  // from "genuinely near-zero odds".
  function hunterCombinedProbability(hunter, year, groupChoice) {
    const points = hunterProjectedPointsAtYear(hunter, year);
    if (points === null) return null;
    const bonus = isNorthernResident(hunter) ? NORTHERN_PREFERENCE_POINT : 0;
    return combinedProbabilityForPoints(points + bonus, year, groupChoice);
  }

  // Probability the GROUP (at least one hunter) draws a tag that year.
  function groupProbability(roster, year, groupChoice) {
    if (!roster || !roster.length) return null;
    let missAll = 1;
    let any = false;
    roster.forEach((hunter) => {
      const p = hunterCombinedProbability(hunter, year, groupChoice);
      if (p === null) return;
      any = true;
      missAll *= 1 - p;
    });
    return any ? 1 - missAll : null;
  }

  function buildGroupProbabilityTable(roster, groupChoice, startYear, endYear) {
    const years = [];
    for (let year = startYear; year <= endYear; year++) years.push(year);
    return years.map((year) => ({ year, probability: groupProbability(roster, year, groupChoice) }));
  }

  // ---------------------------------------------------------------------
  // parseRosterRows - turns flat spreadsheet rows (one row per hunter per
  // year, as read from the roster .xlsx template - Hunter/Year/Points/
  // TagType/Claimed/WMU/Season/MooseType/NorthernResident) into the
  // HUNTER_SEED-shaped roster this app renders and computes from. This is
  // the general-purpose ingestion path: any group's filled-in template
  // produces a roster the same way, regardless of who uploads it.
  // ---------------------------------------------------------------------
  // sheetRowsToObjects - turns a raw array-of-arrays sheet (as read with
  // XLSX's header:1 option) into row objects keyed by column header,
  // finding the header row itself instead of assuming it's row 1. The
  // template's own row 1 is a legend note ("Pale yellow = fields you
  // edit..."), not the Hunter/Year/Points header - reading row 1 as the
  // header (SheetJS's default) silently produced zero usable rows and
  // made every real upload of the template fail with "couldn't read that
  // file". This scans for whichever row actually contains "Hunter".
  function sheetRowsToObjects(rawRows) {
    if (!Array.isArray(rawRows)) return [];
    const headerIndex = rawRows.findIndex(
      (row) => Array.isArray(row) && row.some((cell) => String(cell == null ? "" : cell).trim().toLowerCase() === "hunter")
    );
    if (headerIndex === -1) return [];
    const headers = rawRows[headerIndex].map((h) => String(h == null ? "" : h).trim());
    return rawRows
      .slice(headerIndex + 1)
      .map((row) => {
        const obj = {};
        headers.forEach((h, i) => {
          if (!h) return;
          const cell = row[i];
          obj[h] = cell === undefined ? null : cell;
        });
        return obj;
      })
      .filter((obj) => Object.keys(obj).some((k) => obj[k] !== null && obj[k] !== ""));
  }

  function truthyFlag(value) {
    if (typeof value === "string") return value.trim().toUpperCase() === "Y";
    return !!value;
  }

  function parseRosterRows(rows) {
    const byHunter = new Map();
    (rows || []).forEach((row) => {
      const name = String(row.Hunter || row.hunter || "").trim();
      const year = Number(row.Year ?? row.year);
      const points = Number(row.Points ?? row.points);
      if (!name || !Number.isFinite(year) || !Number.isFinite(points)) return;

      const entry = {
        year,
        points,
        tagType: row.TagType || row.tagType || null,
        claimed: truthyFlag(row.Claimed ?? row.claimed),
        wmu: row.WMU || row.wmu || null,
        season: row.Season || row.season || null,
        mooseType: row.MooseType || row.mooseType || null,
        northernResident: truthyFlag(row.NorthernResident ?? row.northernResident)
      };

      if (!byHunter.has(name)) byHunter.set(name, []);
      byHunter.get(name).push(entry);
    });

    const roster = [];
    byHunter.forEach((pointsHistory, name) => {
      pointsHistory.sort((a, b) => a.year - b.year);
      roster.push({ name, pointsHistory });
    });
    roster.sort((a, b) => a.name.localeCompare(b.name));
    return roster;
  }

  // rosterToRows - the inverse of parseRosterRows, so edits made in-browser
  // can be exported back out as the same flat template shape for re-upload
  // or hand-off to another tool.
  function rosterToRows(roster) {
    const rows = [];
    (roster || []).forEach((hunter) => {
      hunter.pointsHistory.forEach((entry) => {
        rows.push({
          Hunter: hunter.name,
          Year: entry.year,
          Points: entry.points,
          TagType: entry.tagType || "",
          Claimed: entry.claimed ? "Y" : "N",
          WMU: entry.wmu || "",
          Season: entry.season || "",
          MooseType: entry.mooseType || "",
          NorthernResident: entry.northernResident ? "Y" : "N"
        });
      });
    });
    return rows;
  }

  // buildPointsSeries - one {year, points} series per hunter, real history
  // up to the current year plus the same forward projection the forecast
  // engine uses (banked points +1/year), for the points-over-time chart.
  function buildPointsSeries(roster, startYear, endYear) {
    return (roster || []).map((hunter) => {
      const history = (hunter.pointsHistory || []).slice().sort((a, b) => a.year - b.year);
      const points = [];
      history.forEach((entry) => {
        if (entry.year <= startYear) points.push({ year: entry.year, points: entry.points });
      });
      for (let year = startYear; year <= endYear; year++) {
        points.push({ year, points: projectedPoints(hunter, year, startYear) });
      }
      return { name: hunter.name, points };
    });
  }

  // ---------------------------------------------------------------------
  // Persistence - localStorage only, per browser, no accounts/server. A
  // roster the user uploaded (and any in-browser edits since) survives
  // reloads; the demo HUNTER_SEED data is never persisted.
  // ---------------------------------------------------------------------
  const STORAGE_KEY = "mooseTrackerState_v1";

  function loadPersistedState() {
    try {
      if (typeof localStorage === "undefined") return null;
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function persistState() {
    try {
      if (typeof localStorage === "undefined") return;
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          roster: activeRosterIsUploaded ? activeRoster : null,
          groupChoice: groupChoice
        })
      );
    } catch (e) {
      // ignore quota / private-browsing errors - the app still works, just unsaved
    }
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  const RULE_KEYS = ["ruleLicence", "ruleRadius", "ruleKill", "ruleNotch", "ruleReport", "ruleWatch", "ruleAllocation2027"];

  function renderRules() {
    const container = document.getElementById("rulesCards");
    if (!container) return;
    container.innerHTML = "";
    RULE_KEYS.forEach((key) => {
      const rule = I18N[currentLang][key];
      if (!rule) return;
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.rule = key;
      const h = document.createElement("h3");
      h.textContent = rule.h;
      const p = document.createElement("p");
      p.textContent = rule.p;
      card.appendChild(h);
      card.appendChild(p);
      container.appendChild(card);
    });
  }

  // The table stays blank until a real roster exists - either uploaded
  // via the Data tab or built up with "+ Add hunter" - so nobody mistakes
  // placeholder data for their group's real numbers.
  let activeRoster = [];

  (function restorePersistedState() {
    const saved = loadPersistedState();
    if (!saved) return;
    if (saved.roster && Array.isArray(saved.roster) && saved.roster.length > 0) {
      activeRoster = saved.roster;
      activeRosterIsUploaded = true;
    }
    if (isValidGroupChoice(saved.groupChoice)) {
      groupChoice = saved.groupChoice;
    }
  })();

  function setChoiceSlot(stage, index, field, value) {
    const list = (groupChoice[stage] || []).slice();
    if (field === "wmu" && !value) {
      list[index] = null;
    } else {
      const current = list[index] || { wmu: "", mooseType: "", season: "" };
      const slot = Object.assign({}, current);
      if (field === "wmu") {
        slot.wmu = value;
        slot.mooseType = availableMooseTypes(value)[0] || "";
        slot.season = availableSeasons(value, slot.mooseType)[0] || "";
      } else if (field === "mooseType") {
        slot.mooseType = value;
        slot.season = availableSeasons(slot.wmu, value)[0] || "";
      } else if (field === "season") {
        slot.season = value;
      }
      list[index] = slot;
    }
    groupChoice = Object.assign({}, groupChoice, { [stage]: list });
    persistState();
    render();
  }

  function findHunter(name) {
    return activeRoster.find((h) => h.name === name);
  }

  function markEditedAndPersist() {
    activeRosterIsUploaded = true;
    persistState();
    render();
  }

  function updateEntryField(hunterName, idx, field, value) {
    const hunter = findHunter(hunterName);
    const entry = hunter && hunter.pointsHistory[idx];
    if (!entry) return;
    if (field === "year" || field === "points") {
      const n = Number(value);
      if (Number.isFinite(n)) entry[field] = n;
    } else if (field === "claimed" || field === "northernResident") {
      entry[field] = !!value;
    } else if (field === "tagType") {
      entry.tagType = value ? value : null;
    }
    hunter.pointsHistory.sort((a, b) => a.year - b.year);
    markEditedAndPersist();
  }

  function addYearForHunter(hunterName) {
    const hunter = findHunter(hunterName);
    if (!hunter) return;
    const lastYear = hunter.pointsHistory.length
      ? hunter.pointsHistory[hunter.pointsHistory.length - 1].year
      : new Date().getFullYear();
    hunter.pointsHistory.push({
      year: lastYear + 1,
      points: 0,
      tagType: null,
      claimed: false,
      northernResident: false,
      wmu: null,
      season: null,
      mooseType: null
    });
    markEditedAndPersist();
  }

  function deleteEntry(hunterName, idx) {
    const hunter = findHunter(hunterName);
    if (!hunter) return;
    hunter.pointsHistory.splice(idx, 1);
    markEditedAndPersist();
  }

  function addHunterNamed(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    activeRoster = activeRoster.concat([
      {
        name: trimmed,
        pointsHistory: [
          {
            year: new Date().getFullYear(),
            points: 0,
            tagType: null,
            claimed: false,
            northernResident: false,
            wmu: null,
            season: null,
            mooseType: null
          }
        ]
      }
    ]);
    markEditedAndPersist();
  }

    input.dataset.idx = String(idx);
    input.dataset.field = field;
    return input;

  // ---------------------------------------------------------------------
  // buildGroupMatrix - the main view: one row per hunter, one column per
  // year. Past years (an actual pointsHistory entry exists) show the real
  // points banked and, if a tag was won that year, the tag result. Years
  // after a hunter's latest known record show a plain projected points
  // number (banked +1/year), flagged "ready" when that projection would
  // fully clear the chosen WMU's projected cutoff that year (probability
  // ramp from drawProbability() reaching 1, not shown as a percentage -
  // just a plain number and a highlight). This always forecasts for the
  // one WMU/tag type/season/choice the group has chosen, never several
  // WMUs superimposed.
  // ---------------------------------------------------------------------
  // buildGroupMatrix - a year-by-year sequential simulation, not just each
  // hunter projected independently. Party hunting means the group tells
  // one story of who has a tag when, so when a hunter's simulated points
  // would clear the chosen combination's cutoff, that's a tag year: their
  // simulated points reset to 0 the following year, exactly like a real
  // claimed tag resets banked points. When two or more hunters would clear
  // the cutoff in the SAME year, only one can meaningfully be "the" tag
  // holder that year for this sequence, so the simulation picks the one
  // with the most points (closest to certain, and the real draw favours
  // more points) - ties broken alphabetically for a deterministic result -
  // and marks that cell sequenceTag:true. The others stay ready (still
  // shown as clearing the cutoff) but are not reset, since in this
  // simulation they didn't use a tag that year; they carry their points
  // forward and are re-evaluated the following year.
  function buildGroupMatrix(roster, groupChoice, startYear, endYear) {
    const years = [];
    for (let year = startYear; year <= endYear; year++) years.push(year);

    const hunters = roster || [];
    const actualByHunter = new Map(
      hunters.map((h) => [h.name, new Map((h.pointsHistory || []).map((e) => [e.year, e]))])
    );
    const simPoints = new Map(hunters.map((h) => [h.name, pointsGoingForward(h)]));
    const lastKnownYear = new Map(hunters.map((h) => [h.name, latestEntry(h) ? latestEntry(h).year : null]));
    const cellsByHunter = new Map(hunters.map((h) => [h.name, new Map()]));

    years.forEach((year) => {
      const projectedThisYear = [];

      hunters.forEach((hunter) => {
        const entry = actualByHunter.get(hunter.name).get(year);
        if (entry) {
          cellsByHunter.get(hunter.name).set(year, {
            year,
            kind: "actual",
            points: entry.points,
            tagType: entry.tagType || null,
            claimed: !!entry.claimed
          });
          return;
        }
        const last = lastKnownYear.get(hunter.name);
        if (last !== null && year > last) {
          projectedThisYear.push(hunter);
        } else {
          cellsByHunter.get(hunter.name).set(year, { year, kind: "empty" });
        }
      });

      const bonusFor = (hunter) => (isNorthernResident(hunter) ? NORTHERN_PREFERENCE_POINT : 0);
      const evaluated = projectedThisYear.map((hunter) => {
        // simPoints holds points as banked as of the last resolved year;
        // this year's accrual (the +1 for applying this year without
        // having won yet) happens now, before evaluating this year's odds.
        const points = simPoints.get(hunter.name) + 1;
        const probability = combinedProbabilityForPoints(points + bonusFor(hunter), year, groupChoice);
        return { hunter, points, ready: probability !== null && probability >= 1 };
      });

      const ready = evaluated.filter((e) => e.ready);
      let winnerName = null;
      if (ready.length > 0) {
        ready.sort((a, b) => b.points - a.points || a.hunter.name.localeCompare(b.hunter.name));
        winnerName = ready[0].hunter.name;
      }

      evaluated.forEach(({ hunter, points, ready: isReady }) => {
        const isWinner = hunter.name === winnerName;
        cellsByHunter.get(hunter.name).set(year, {
          year,
          kind: "projected",
          points,
          ready: isReady,
          sequenceTag: isWinner
        });
        simPoints.set(hunter.name, isWinner ? 0 : points);
      });
    });

    const rows = hunters.map((hunter) => ({
      name: hunter.name,
      cells: years.map((year) => cellsByHunter.get(hunter.name).get(year) || { year, kind: "empty" })
    }));

    return { years, rows };
  }

  const MATRIX_SORT_KEYS = { NAME: "name" };

  function matrixCellValue(row, key) {
    if (key === MATRIX_SORT_KEYS.NAME) return row.name;
    const cell = row.cells.find((c) => c.year === key);
    if (!cell || cell.kind === "empty") return -Infinity;
    return cell.points;
  }

  // sortMatrixRows - lets any column (hunter name, or any year) become the
  // sort key, so the group can answer "who's ready soonest" by clicking a
  // year instead of reading the whole table.
  function sortMatrixRows(matrix, key, direction) {
    const dir = direction === "desc" ? -1 : 1;
    const rows = matrix.rows.slice().sort((a, b) => {
      const va = matrixCellValue(a, key);
      const vb = matrixCellValue(b, key);
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return a.name.localeCompare(b.name);
    });
    return { years: matrix.years, rows };
  }

  function renderMatrix() {
    const head = document.getElementById("matrixTableHead");
    const body = document.getElementById("matrixBody");
    if (!head || !body) return;
    const heading = document.getElementById("matrixHeading");
    if (heading) heading.textContent = t("matrixHeading");
    const desc = document.getElementById("matrixDesc");
    if (desc) desc.textContent = t("matrixDesc");

    const empty = document.getElementById("matrixEmpty");
    const wrap = document.getElementById("matrixWrap");
    const isEmpty = activeRoster.length === 0;
    if (empty) {
      empty.hidden = !isEmpty;
      if (isEmpty) empty.textContent = t("matrixEmptyState");
    }
    if (wrap) wrap.hidden = isEmpty;
    if (isEmpty) {
      head.innerHTML = "";
      body.innerHTML = "";
      return;
    }

    const currentYear = new Date().getFullYear();
    const historyYears = activeRoster.flatMap((h) => (h.pointsHistory || []).map((e) => e.year));
    const startYear = historyYears.length ? Math.min(currentYear, ...historyYears) : currentYear;
    const endYear = currentYear + FORECAST_SPAN_YEARS;
    let matrix = buildGroupMatrix(activeRoster, groupChoice, startYear, endYear);
    matrix = sortMatrixRows(matrix, matrixSort.key, matrixSort.direction);

    const nameLabel = t("table").name;
    const arrow = matrixSort.direction === "desc" ? " ▾" : " ▴";
    function headerCell(key, label) {
      const sorted = matrixSort.key === key;
      return (
        '<th class="matrix-col' +
        (key === currentYear ? " matrix-current" : "") +
        '"><button type="button" class="matrix-sort-btn' +
        (sorted ? " active" : "") +
        '" data-action="sort-matrix" data-key="' +
        key +
        '">' +
        label +
        (sorted ? arrow : "") +
        "</button></th>"
      );
    }
    head.innerHTML = headerCell("name", nameLabel) + matrix.years.map((y) => headerCell(y, y)).join("");

    body.innerHTML = "";
    matrix.rows.forEach((row) => {
      const tr = document.createElement("tr");
      const nameCell = document.createElement("td");
      nameCell.className = "matrix-name";
      nameCell.textContent = row.name;
      tr.appendChild(nameCell);
      row.cells.forEach((cell) => {
        const td = document.createElement("td");
        const classes = ["matrix-cell", "matrix-" + cell.kind];
        if (cell.ready) classes.push("matrix-ready");
        if (cell.sequenceTag) classes.push("matrix-sequence-tag");
        if (cell.year === currentYear) classes.push("matrix-current");
        td.className = classes.join(" ");
        if (cell.kind === "actual") {
          const tagLabel = cell.tagType ? cell.tagType + (cell.claimed ? " ✓" : "") : "";
          td.innerHTML = cell.points + (tagLabel ? '<div class="matrix-tag">' + tagLabel + "</div>" : "");
        } else if (cell.kind === "projected") {
          const badge = cell.sequenceTag ? '<div class="matrix-tag matrix-tag-sim">' + t("matrixSequenceBadge") + "</div>" : "";
          td.innerHTML = cell.points + badge;
        } else {
          td.textContent = "–";
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    const legend = document.getElementById("matrixLegend");
    if (legend) legend.innerHTML = t("matrixLegend");
  }

  function renderDataStatus() {
    const status = document.getElementById("dataStatus");
    if (status) {
      const count = activeRoster.length;
      status.textContent = count > 0 ? t("dataStatusUploaded", count) : t("dataStatusEmpty");
    }
    const exportBtn = document.getElementById("exportBtn");
    if (exportBtn) exportBtn.textContent = t("exportBtn");
  }

  // ---------------------------------------------------------------------
  // Tabs - the app used to be one long scroll of unrelated sections
  // (rules, roster, target, chart, forecast, data all stacked). Splitting
  // it into tabs groups related tools together and gives a first, glanceable
  // "Overview" screen instead of making the reader scroll past everything.
  // ---------------------------------------------------------------------
  const TAB_IDS = ["overview", "roster", "rules", "data"];
  let activeTab = "overview";
  let matrixSort = { key: "name", direction: "asc" };

  function sortMatrixBy(key) {
    const numericKey = key === "name" ? "name" : Number(key);
    if (matrixSort.key === numericKey) {
      matrixSort = { key: numericKey, direction: matrixSort.direction === "asc" ? "desc" : "asc" };
    } else {
      matrixSort = { key: numericKey, direction: "asc" };
    }
    renderMatrix();
  }

  function showTab(name) {
    if (!TAB_IDS.includes(name)) return;
    activeTab = name;
    renderTabs();
  }

  function renderTabs() {
    const nav = document.getElementById("tabNav");
    if (!nav) return;
    TAB_IDS.forEach((id) => {
      const btn = document.getElementById("tabBtn" + id.charAt(0).toUpperCase() + id.slice(1));
      if (btn) {
        btn.textContent = t("tab" + id.charAt(0).toUpperCase() + id.slice(1));
        btn.classList.toggle("active", id === activeTab);
      }
      const panel = document.getElementById("tab-" + id);
      if (panel) panel.classList.toggle("active", id === activeTab);
    });
  }

  function render() {
    renderStaticText();
    renderBanner();
    renderRules();
    renderRoster();
    renderChoiceTable();
    renderProbabilityTable();
    renderMatrix();
    renderDataStatus();
    renderTabs();
    const toggle = document.getElementById("langToggle");
    if (toggle) toggle.textContent = currentLang === "en" ? "FR" : "EN";
  }

  function loadRoster(roster) {
    activeRoster = roster;
    activeRosterIsUploaded = true;
    persistState();
    render();
  }

  function handleRosterFile(file) {
    if (!file || typeof XLSX === "undefined") return;
    const status = document.getElementById("dataStatus");
    file
      .arrayBuffer()
      .then((buffer) => {
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheetName =
          workbook.SheetNames.find((n) => /points/i.test(n)) ||
          workbook.SheetNames[workbook.SheetNames.length - 1];
        const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: null });
        const rows = sheetRowsToObjects(rawRows);
        const roster = parseRosterRows(rows);
        if (roster.length === 0) throw new Error("empty roster");
        loadRoster(roster);
      })
      .catch(() => {
        if (status) status.textContent = t("dataStatusError");
      });
  }

  function exportRoster() {
    if (typeof XLSX === "undefined") return;
    const rows = rosterToRows(activeRoster);
    const sheet = XLSX.utils.json_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, "Points Tracker");
    XLSX.writeFile(workbook, "moose-group-points-export.xlsx");
  }

  function setLang(lang) {
    if (lang !== "en" && lang !== "fr") return;
    currentLang = lang;
    render();
  }

  function toggleLang() {
    setLang(currentLang === "en" ? "fr" : "en");
  }

  function handleDelegatedChange(event) {
    const el = event.target;
    if (!el || !el.dataset) return;
    if (el.dataset.action === "edit-entry") {
      const value = el.type === "checkbox" ? el.checked : el.value;
      updateEntryField(el.dataset.name, Number(el.dataset.idx), el.dataset.field, value);
      return;
    }
    if (el.dataset.action === "edit-choice") {
      setChoiceSlot(el.dataset.stage, Number(el.dataset.index), el.dataset.field, el.value);
    }
  }

  function handleDelegatedClick(event) {
    const el = event.target.closest && event.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action === "add-year") addYearForHunter(el.dataset.name);
    else if (action === "delete-entry") deleteEntry(el.dataset.name, Number(el.dataset.idx));
    else if (action === "add-hunter") addHunter();
    else if (action === "export-roster") exportRoster();
    else if (action === "show-tab") showTab(el.dataset.tab);
    else if (action === "sort-matrix") sortMatrixBy(el.dataset.key);
  }

  if (typeof document !== "undefined") {
    document.addEventListener("change", handleDelegatedChange);
    document.addEventListener("click", handleDelegatedClick);
    document.addEventListener("DOMContentLoaded", function () {
      const toggle = document.getElementById("langToggle");
      if (toggle) toggle.addEventListener("click", toggleLang);
      const upload = document.getElementById("rosterUpload");
      if (upload) {
        upload.addEventListener("change", function (event) {
          const file = event.target.files && event.target.files[0];
          handleRosterFile(file);
        });
      }
      render();
    });
  }

  // Expose for tests (jsdom) without affecting the browser UI.
  if (typeof window !== "undefined") {
    window.APP = {
      I18N,
      t,
      setLang,
      showTab,
      getActiveTab: () => activeTab,
      getLang: () => currentLang,
      HUNTER_SEED,
      getSeasonPhase,
      computeTimeline,
      parseRosterRows,
      sheetRowsToObjects,
      rosterToRows,
      buildPointsSeries,
      loadRoster,
      getActiveRoster: () => activeRoster,
      isRosterUploaded: () => activeRosterIsUploaded,
      NORTHERN_PREFERENCE_POINT,
      MOOSE_TRENDS,
      DEFAULT_GROUP_CHOICE,
      getGroupChoice: () => groupChoice,
      setChoiceSlot,
      getTrendSeries,
      availableWMUs,
      availableMooseTypes,
      availableSeasons,
      availableStages,
      availableChoices,
      projectCutoff,
      drawProbability,
      buildHunterForecast,
      computeGroupStaggering,
      collectChoiceSlots,
      hunterCombinedProbability,
      groupProbability,
      buildGroupProbabilityTable,
      pointsGoingForward,
      buildGroupMatrix,
      sortMatrixRows,
      combinedProbabilityForPoints,
      sortMatrixBy,
      getMatrixSort: () => matrixSort,
      renderMatrix,
      updateEntryField,
      addYearForHunter,
      deleteEntry,
      addHunterNamed,
      render
    };
  }
})();
</script>

</div>
</body>
</html>
