<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moose Group Points Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8e0cf;
    --surface: #ffffff;
    --surface-2: #d9ccb0;
    --ink: #15130f;
    --ink-dim: #3f3a31;
    --line: #b9ad95;
    --accent: #1f4a28;
    --accent-2: #2f6a3a;
    --accent-soft: #c7e2cb;
    --on-accent: #ffffff;
    --amber: #7d4508;
    --amber-soft: #f6e2c2;
    --red: #9a2e19;
    --red-soft: #f6d9cf;
    --radius: .7rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151812;
      --surface: #20251b;
      --surface-2: #353d2b;
      --ink: #f4efe2;
      --ink-dim: #cfc8b3;
      --line: #555d48;
      --accent: #8fcc98;
      --accent-2: #aedcb4;
      --accent-soft: #2f4a33;
      --on-accent: #10140e;
      --amber: #f0b068;
      --amber-soft: #3f321d;
      --red: #ef9277;
      --red-soft: #45271f;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  h2 { font-size: 1.35rem; margin-bottom: .25rem; }
  h3 { font-size: 1.05rem; }
  p { color: var(--ink-dim); }

  header.app-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: .75rem; padding: 1rem 1.2rem; margin-bottom: 1rem;
    background: var(--accent); color: var(--on-accent); border-radius: var(--radius);
  }
  header.app-header h1 { font-size: clamp(1.4rem, 3.5vw, 1.9rem); }
  .header-eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--on-accent); font-weight: 700; margin: 0 0 .15rem; opacity: .85; }
  .header-actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .calc-stamp { font-size: .8rem; font-weight: 600; }

  header.app-header button {
    background: var(--on-accent); border: 2px solid var(--on-accent); color: var(--accent);
    border-radius: 999px; padding: .4rem .95rem; font-weight: 700; font-size: .88rem;
  }
  header.app-header button:hover { background: transparent; color: var(--on-accent); }

  #deadlineBanner {
    padding: .9rem 1.1rem; border-radius: var(--radius); margin: 0 0 1.25rem;
    background: var(--amber-soft); border: 2px solid var(--amber); color: var(--ink);
    font-size: .95rem; font-weight: 600;
    display: flex; align-items: center; gap: .6rem;
  }
  #deadlineBanner::before { content: "\1F4C5"; font-size: 1.1rem; }
  #deadlineBanner.urgent { background: var(--amber-soft); border-color: var(--amber); color: var(--ink); }
  #deadlineBanner.urgent::before { content: "\23F3"; }

  nav.tabs {
    display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    border-bottom: 3px solid var(--accent); padding-bottom: 0;
  }
  nav.tabs button {
    background: var(--surface-2); border: none;
    color: var(--ink); font-family: "Source Sans 3", sans-serif; font-weight: 700;
    font-size: .95rem; padding: .6rem .95rem; cursor: pointer; border-radius: .45rem .45rem 0 0;
  }
  nav.tabs button:hover { background: var(--line); color: var(--ink); }
  nav.tabs button.active { background: var(--accent); color: var(--on-accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein .15s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  section { margin-bottom: 2rem; }
  section > p:first-of-type { margin-top: .15rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1rem 1.1rem;
  }
  .card h3 { margin-top: 0; margin-bottom: .35rem; color: var(--accent); }
  .card p { margin: 0; font-size: .9rem; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.1rem 1.2rem; margin-top: .75rem;
  }

  table { width: 100%; border-collapse: collapse; margin-top: .75rem; font-size: .92rem; }
  th, td { border-bottom: 1px solid var(--line); padding: .55rem .6rem; text-align: left; }
  table { background: var(--surface); }
  thead th {
    background: var(--ink); color: var(--bg); font-size: .76rem; text-transform: uppercase;
    letter-spacing: .05em; font-weight: 700; border-bottom: none;
  }
  tbody tr:hover { background: var(--surface-2); }
  .table-scroll { overflow-x: auto; }

  button {
    cursor: pointer; font-family: inherit; border-radius: .5rem; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: .5rem .9rem; font-weight: 600; font-size: .88rem;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--on-accent); }

  #dataSection input[type="file"] {
    display: block; margin: .6rem 0; padding: .6rem; border: 1px dashed var(--line);
    border-radius: .5rem; background: var(--surface); width: 100%; max-width: 420px; font-size: .85rem;
  }
  #templateLink { display: inline-block; margin: .5rem .5rem .5rem 0; font-weight: 600; color: var(--accent); }

  .roster-actions { margin-top: .75rem; }
  #rosterTable input[type="number"] { width: 4.5rem; }
  #rosterTable input[type="text"] { width: 7rem; }
  #rosterTable input {
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    border-radius: .35rem; padding: .3rem .45rem; font: inherit; font-size: .88rem;
  }
  #rosterTable input:focus { border-color: var(--accent); outline: none; }
  #rosterTable button[data-action="delete-entry"] {
    width: 1.8rem; height: 1.8rem; padding: 0; line-height: 1; border-radius: .4rem;
  }
  #rosterTable button[data-action="delete-entry"]:hover { border-color: var(--red); color: var(--red); }
  #rosterTable tr td[colspan] button { font-size: .82rem; }

  .target-controls { display: flex; flex-wrap: wrap; gap: .9rem 1.4rem; align-items: center; }
  .target-controls label { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; font-weight: 600; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .04em; }
  .target-controls select {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: .45rem; padding: .4rem .55rem; font: inherit; font-size: .92rem; text-transform: none; letter-spacing: 0;
  }
  .warning {
    color: var(--red); background: var(--red-soft); border: 1px solid var(--red);
    border-radius: .5rem; padding: .6rem .8rem; margin-top: .9rem; font-size: .88rem;
  }

  .chart-legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; margin-top: .75rem; font-size: .85rem; color: var(--ink-dim); }
  .chart-legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .chart-legend i { width: .7rem; height: .7rem; border-radius: 3px; display: inline-block; }
  .chart-legend i.legend-ready { background: var(--accent-soft); border: 2px solid var(--accent); }
  .chart-legend i.legend-current { background: var(--surface-2); border: 2px solid var(--amber); }

  /* table-layout: auto + width: auto (overriding the global table{width:100%})
     lets this table grow wider than its wrapper once there are enough year
     columns, so .table-scroll's overflow-x: auto actually kicks in instead
     of squeezing every column down to fit. min-width: 100% keeps it filling
     the wrapper when there's few enough years that it doesn't need to. */
  table[id$="atrixTable"] { table-layout: auto; width: auto; min-width: 100%; }
  table[id$="atrixTable"] th, table[id$="atrixTable"] td { text-align: center; padding: .5rem .55rem; white-space: nowrap; min-width: 3.6rem; }
  table[id$="atrixTable"] th:first-child, table[id$="atrixTable"] td.matrix-name {
    position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1;
    box-shadow: 2px 0 0 var(--line); min-width: 7rem;
  }
  table[id$="atrixTable"] thead th:first-child { background: var(--ink); }
  table[id$="atrixTable"] tbody tr:hover td.matrix-name { background: var(--surface-2); }
  .matrix-name { font-weight: 600; }
  th.matrix-col { font-variant-numeric: tabular-nums; }
  /* Current year: a tint plus amber edges, since a tint alone is too faint. */
  th.matrix-current, td.matrix-current {
    background: var(--surface-2);
    box-shadow: inset 2px 0 0 var(--amber), inset -2px 0 0 var(--amber);
  }
  th.matrix-current { color: var(--ink); }
  td.matrix-cell { font-variant-numeric: tabular-nums; color: var(--ink); }
  td.matrix-actual { font-weight: 700; }
  td.matrix-projected { font-weight: 400; }
  td.matrix-empty { color: var(--ink-dim); }
  td.matrix-ready { background: var(--accent-soft); color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 2px var(--accent); }
  .matrix-tag { font-size: .7rem; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  td.matrix-sequence-tag { background: var(--accent); color: var(--on-accent); font-weight: 700; box-shadow: none; }
  .matrix-sequence-tag .matrix-tag-sim { color: var(--on-accent); }
  tr.matrix-cutoff-row td { background: var(--amber-soft); border-bottom: 2px solid var(--amber); }
  .matrix-cutoff-label { font-size: .8rem; font-weight: 700; color: var(--ink); }
  td.matrix-cutoff { font-weight: 700; color: var(--amber); }
  .matrix-flag {
    display: inline-block; margin-left: .2rem; padding: 0 .3rem; border-radius: .3rem;
    background: var(--red); color: var(--on-accent); font-size: .7rem; font-weight: 700; cursor: help;
  }
  .legend-flag { display: inline-block; padding: 0 .3rem; border-radius: .3rem; background: var(--red); color: var(--on-accent); font-size: .7rem; font-weight: 700; }
  .matrix-skipped { color: var(--red); }
  .matrix-birth { font-weight: 400; font-size: .75rem; color: var(--ink-dim); }
  .matrix-note { font-size: .88rem; color: var(--ink); background: var(--amber-soft); border-left: 3px solid var(--amber); padding: .5rem .8rem; border-radius: 0 .4rem .4rem 0; }
  .matrix-sort-btn {
    background: none; border: none; padding: 0; margin: 0; font: inherit; font-weight: inherit;
    color: inherit; cursor: pointer; white-space: nowrap;
  }
  .matrix-sort-btn:hover, .matrix-sort-btn.active { text-decoration: underline; text-underline-offset: .2em; }
  .legend-sequence { background: var(--accent); }

  .empty-state {
    background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 1.4rem; text-align: center; font-size: .92rem; margin-top: .75rem;
  }

  .tab-intro {
    background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0;
    padding: .85rem 1.1rem; font-size: .92rem; margin-bottom: 1.2rem;
  }

  table[id$="hoiceTable"] th, table[id$="hoiceTable"] td { text-align: left; }
  table[id$="hoiceTable"] .choice-label { font-weight: 600; white-space: nowrap; }
  table[id$="hoiceTable"] .choice-section-row td {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-dim);
    font-weight: 700; border-bottom: none; padding-top: 1rem;
  }
  table[id$="hoiceTable"] select {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: .45rem; padding: .35rem .5rem; font: inherit; font-size: .9rem; min-width: 6rem;
  }
  .choice-nodata { font-size: .82rem; font-weight: 600; color: var(--red); white-space: normal; max-width: 22rem; }

  .timeline-year { font-weight: 600; font-variant-numeric: tabular-nums; width: 5rem; }
  tr.timeline-current td { background: var(--surface-2); box-shadow: inset 0 2px 0 var(--amber), inset 0 -2px 0 var(--amber); }
  .timeline-tag { padding: .1rem 0; }
  .timeline-status { color: var(--ink-dim); }
  .timeline-predicted { color: var(--accent); font-weight: 600; }
  .timeline-predicted .pill {
    display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
    background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: .05rem .5rem; margin-right: .2rem;
  }
  .timeline-none { color: var(--ink-dim); }

  @media (max-width: 640px) {
    .target-controls { flex-direction: column; align-items: stretch; }
    nav.tabs { overflow-x: auto; flex-wrap: nowrap; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<div class="wrap">

<header class="app-header">
  <div>
    <p class="header-eyebrow">&#x1F98C; Group Points Tracker · <span id="appVersion"></span></p>
    <h1 id="appTitle">Moose Group Points Tracker</h1>
  </div>
  <div class="header-actions">
    <span id="calcStamp" class="calc-stamp"></span>
    <button id="recalcBtn" type="button" data-action="recalc"></button>
    <button id="langToggle" type="button">FR</button>
  </div>
</header>

<div id="deadlineBanner"></div>

<nav class="tabs" id="tabNav">
  <button type="button" data-action="show-tab" data-tab="overview" id="tabBtnOverview"></button>
  <button type="button" data-action="show-tab" data-tab="alt" id="tabBtnAlt"></button>
  <button type="button" data-action="show-tab" data-tab="roster" id="tabBtnRoster"></button>
  <button type="button" data-action="show-tab" data-tab="rules" id="tabBtnRules"></button>
  <button type="button" data-action="show-tab" data-tab="data" id="tabBtnData"></button>
</nav>

<div class="tab-panel" id="tab-overview" data-tab-panel="overview">
  <section id="targetSection">
    <h2 id="targetHeading">Group Choice</h2>
    <p id="targetDesc"></p>
    <div class="panel">
      <div class="table-scroll">
        <table id="choiceTable">
          <thead>
            <tr id="choiceTableHead"></tr>
          </thead>
          <tbody id="choiceBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="timelineSection">
    <h2 id="timelineHeading">Tags by Year</h2>
    <p id="timelineDesc"></p>
    <div class="table-scroll">
      <table id="timelineTable">
        <thead>
          <tr id="timelineTableHead"></tr>
        </thead>
        <tbody id="timelineBody"></tbody>
      </table>
    </div>
  </section>

  <section id="matrixSection">
    <h2 id="matrixHeading">Where The Team Stands</h2>
    <p id="matrixDesc"></p>
    <p id="matrixNote" class="matrix-note" hidden></p>
    <p id="matrixEmpty" class="empty-state" hidden></p>
    <div class="table-scroll" id="matrixWrap">
      <table id="matrixTable">
        <thead>
          <tr id="matrixTableHead"></tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="chart-legend" id="matrixLegend"></div>
  </section>
</div>

<div class="tab-panel" id="tab-alt" data-tab-panel="alt">
  <p id="altIntro" class="tab-intro"></p>
  <section id="altTargetSection">
    <h2 id="altTargetHeading">Group Choice</h2>
    <p id="altTargetDesc"></p>
    <div class="panel">
      <div class="table-scroll">
        <table id="altChoiceTable">
          <thead>
            <tr id="altChoiceTableHead"></tr>
          </thead>
          <tbody id="altChoiceBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="altTimelineSection">
    <h2 id="altTimelineHeading">Tags by Year</h2>
    <p id="altTimelineDesc"></p>
    <div class="table-scroll">
      <table id="altTimelineTable">
        <thead>
          <tr id="altTimelineTableHead"></tr>
        </thead>
        <tbody id="altTimelineBody"></tbody>
      </table>
    </div>
  </section>

  <section id="altMatrixSection">
    <h2 id="altMatrixHeading">Where The Team Stands</h2>
    <p id="altMatrixDesc"></p>
    <p id="altMatrixNote" class="matrix-note" hidden></p>
    <p id="altMatrixEmpty" class="empty-state" hidden></p>
    <div class="table-scroll" id="altMatrixWrap">
      <table id="altMatrixTable">
        <thead>
          <tr id="altMatrixTableHead"></tr>
        </thead>
        <tbody id="altMatrixBody"></tbody>
      </table>
    </div>
    <div class="chart-legend" id="altMatrixLegend"></div>
  </section>
</div>

<div class="tab-panel" id="tab-roster" data-tab-panel="roster">
  <section id="rosterSection">
    <h2 id="rosterHeading">Roster</h2>
    <p id="rosterEditHint"></p>
    <p id="rosterEmpty" class="empty-state" hidden></p>
    <div class="table-scroll" id="rosterWrap">
      <table id="rosterTable">
        <thead>
          <tr id="rosterTableHead"></tr>
        </thead>
        <tbody id="rosterBody"></tbody>
      </table>
    </div>
    <div class="roster-actions">
      <button type="button" class="primary" id="addHunterBtn" data-action="add-hunter"></button>
    </div>
  </section>
</div>

<div class="tab-panel" id="tab-rules" data-tab-panel="rules">
  <section id="rulesSection">
    <h2 id="rulesHeading">Key Rules</h2>
    <div class="cards" id="rulesCards"></div>
  </section>
</div>

<div class="tab-panel" id="tab-data" data-tab-panel="data">
  <section id="dataSection">
    <h2 id="dataHeading">Data</h2>
    <p id="dataStatus"></p>
    <input type="file" id="rosterUpload" accept=".xlsx">
    <div>
      <a id="templateLink" href="moose-group-points-template.xlsx" download>Download roster template (.xlsx)</a>
      <button type="button" id="exportBtn" data-action="export-roster"></button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // NORTHERN_PREFERENCE_POINT
  // ---------------------------------------------------------------------
  // Added to a Northern Ontario resident's calculated points every year
  // (see computeHunterPoints), for display and for the cutoff comparison.
  const NORTHERN_PREFERENCE_POINT = 1;

  // Shown in the header so anyone can tell which copy of the tracker they
  // have open. Bump on every change that's pushed.
  const APP_VERSION = "2026-09-29.2";

  // ---------------------------------------------------------------------
  // I18N
  // ---------------------------------------------------------------------
  const I18N = {
    en: {
      appTitle: "Moose Group Points Tracker",

      dataHeading: "Data",
      dataStatusEmpty: "No roster loaded yet. Upload your group's filled-in .xlsx template below to see your team.",
      dataStatusUploaded: (n) => `Showing uploaded data for ${n} hunter${n === 1 ? "" : "s"}.`,
      dataStatusLoaded: (n, name, time) => `Loaded ${n} hunter${n === 1 ? "" : "s"} from ${name} (${time}) — everything has been recalculated.`,

      recalcBtn: "Recalculate",
      calcStamp: (time) => `Calculated at ${time}`,
      versionLabel: (v) => `Version ${v}`,
      dataStatusError: "Couldn't read that file. Make sure it's the roster template .xlsx with a Hunter/Year/Points row per entry.",
      targetHeading: "Group Choice",
      targetDesc: "The whole team applies with the same strategy, so set it once here: up to 3 ranked WMU/type/season choices for the Primary draw, and up to 3 for Second Chance — matching Ontario's real application form. Leave a row on “—” if the group doesn't use that choice slot.",
      choiceColumns: { wmu: "WMU", type: "Tag type", season: "Season" },
      choiceSectionPrimary: "Primary Allocation",
      choiceSectionSecond: "Second Chance",
      choicePrimary1: "Choice 1",
      choicePrimary2: "Choice 2",
      choicePrimary3: "Choice 3",
      choiceSecond1: "Choice 1",
      choiceSecond2: "Choice 2",
      choiceSecond3: "Choice 3",
      choiceNone: "—",
      choiceNoData: "MNR has no cutoff for this combination in this choice, so it can't predict tags — pick another.",
      choiceNoSlotData: "MNR publishes no cutoffs for this choice in any WMU, so it can't be used for predictions.",
      timelineHeading: "Tags by Year",

      matrixLegend: "<span><i class=\"legend-ready\"></i>Qualifies, no tag this year</span><span><i class=\"legend-sequence\"></i>Predicted tag (points reset next year unless Second Chance 2/3)</span><span><b class=\"legend-flag\">!</b>Differs from your sheet</span><span><i class=\"legend-current\"></i>Current year</span>",
      matrixSequenceBadge: "Tag",
      matrixCutoffLabel: "Cutoff",
      matrixNotApplied: "didn't apply",
      stagePrimary: "Primary",

  function t(key, ...args) {
    const parts = key.split(".");
    let val = I18N[currentLang];
    for (const p of parts) {
      if (val == null) return "";
      val = val[p];
    }
    if (typeof val === "function") return val(...args);
    return val;
  }

  // ---------------------------------------------------------------------
  // getSeasonPhase(today) - deadline-tracker banner logic.
  // ---------------------------------------------------------------------
  function daysBetween(from, to) {
    const msPerDay = 24 * 60 * 60 * 1000;
    const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    const b = new Date(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.round((b - a) / msPerDay);
  }

  function getSeasonPhase(today) {
    const year = today.getFullYear();
    const md = (today.getMonth() + 1) * 100 + today.getDate(); // e.g. Aug 1 -> 801

    if (md >= 101 && md <= 131) {
      const deadline = new Date(year, 0, 31);
      const d = daysBetween(today, deadline);
      return { key: "applicationOpen", daysUntil: d, urgent: d <= 7 };
    }
    if (md >= 201 && md <= 430) {
      const deadline = new Date(year, 3, 30);
      const d = daysBetween(today, deadline);
      return { key: "applicationClosed", daysUntil: d, urgent: false };
    }
    if (md >= 501 && md <= 531) {
      const deadline = new Date(year, 4, 31);
      const d = daysBetween(today, deadline);
      return { key: "drawResults", daysUntil: d, urgent: false };
    }
    if (md >= 601 && md <= 731) {
      const deadline = new Date(year, 6, 31);
      const d = daysBetween(today, deadline);
      return { key: "secondChanceOpen", daysUntil: d, urgent: d <= 7 };
    }

    // Aug 1 - Nov 15 window: this is where the confirmed 2027 allocation
    // changes (ERO 019-7813) branch the logic. Pre-2027 seasons keep the
    // original single secondChanceClaim phase running to ~Dec 15; 2027+
    // seasons split this span into the advanced claim window plus the new
    // Last Chance Allocation stage, both with dates still TBD from MNR.
    if (md >= 801 && md <= 1115) {
      if (year < 2027) {
        const deadline = new Date(year, 11, 15);
        const d = daysBetween(today, deadline);
        return { key: "secondChanceClaim", daysUntil: d, urgent: d <= 14 };
      }

      if (md >= 801 && md <= 831) {
        return { key: "secondChanceClaimAdvanced", daysUntil: null, urgent: true };
      }
      if (md >= 901 && md <= 914) {
        const deadline = new Date(year, 8, 15);
        const d = daysBetween(today, deadline);
        return { key: "lastChanceUpcoming", daysUntil: d, urgent: d <= 7 };
      }
      // Sep 15 - Nov 15
      return { key: "lastChance", daysUntil: null, urgent: false };
    }

    if (md >= 1116 && md <= 1215) {
      const deadline = new Date(year, 11, 15);
      const d = daysBetween(today, deadline);
      return { key: "seasonActive", daysUntil: d, urgent: d <= 3 };
    }

    // Dec 16 - Dec 31, off season until next application window opens.
    const nextOpen = new Date(year + 1, 0, 1);
    const d = daysBetween(today, nextOpen);
    return { key: "offSeason", daysUntil: d, urgent: false };
  }

  // ---------------------------------------------------------------------
  // Points engine. Claimed tags are what points count from, so points are
  // calculated rather than read from the sheet. Going into each year's
  // draw a hunter has:
  //   - their first recorded year: the Points entered (starting balance)
  //   - after that: 0 the year after a claimed tag (unless it came from
  //     Second Chance choice 2 or 3, which doesn't reset points),
  //     otherwise last year's points +1 if they applied (+0 if they didn't)
  // The Northern Resident point is added on top every year, so a Northern
  // resident's total never drops to 0. Awarded-but-not-claimed tags don't
  // reset anything.
  // ---------------------------------------------------------------------
  function isNorthernResident(hunter) {
    return !!(hunter && hunter.northernResident);
  }

  function northernBonus(hunter) {
    return isNorthernResident(hunter) ? NORTHERN_PREFERENCE_POINT : 0;
  }

  // "Primary 1", "P2", "Second Chance 3", "SC2", "2nd chance choice 3"...
  function parseDraw(value) {
    const text = String(value == null ? "" : value).trim();
    if (!text) return null;
    const digit = text.replace(/2nd/i, "").match(/[123]/);
    if (!digit) return null;
    const second = /second|chance|sc/i.test(text);
    return { stage: second ? "Second Chance" : "Primary", choice: digit[0] };
  }

  function drawLabel(draw) {
    return draw ? draw.stage + " " + draw.choice : "";
  }

  function tagResetsPoints(draw) {
    return !(draw && draw.stage === "Second Chance" && (draw.choice === "2" || draw.choice === "3"));
  }

  function poolAfter(pool, entry) {
    if (entry && entry.claimed && tagResetsPoints(parseDraw(entry.draw))) return 0;
    const applied = !entry || entry.applied !== false;
    return applied ? pool + 1 : pool;
  }

  // One entry per year from the hunter's first to last record (rows after
  // lastYear aren't history yet and are ignored); a year with no row counts
  // as applied, no tag. mismatch flags where the sheet itself breaks the
  // rules: its Points differ from what its previous row's Points lead to.
  // (Comparing against the calculated chain instead would flag every row
  // after a single mistake.)
  function computeHunterPoints(hunter, lastYear) {
    const rows = (hunter.pointsHistory || [])
      .filter((e) => e.year <= lastYear)
      .slice()
      .sort((a, b) => a.year - b.year);
    if (!rows.length) return { years: [], nextPool: null, lastYear: null };
    const byYear = new Map(rows.map((e) => [e.year, e]));
    const bonus = northernBonus(hunter);
    const first = rows[0].year;
    const last = rows[rows.length - 1].year;
    let pool = Number.isFinite(rows[0].points) ? rows[0].points : 0;
    const years = [];
    for (let year = first; year <= last; year++) {
      const entry = byYear.get(year) || null;
      const prev = byYear.get(year - 1);
      const expectedFromSheet =
        prev && Number.isFinite(prev.points) ? poolAfter(prev.points, prev) : null;
      const mismatch =
        !!entry && Number.isFinite(entry.points) && expectedFromSheet !== null && entry.points !== expectedFromSheet;
      years.push({ year, pool, total: pool + bonus, entry, mismatch, expectedFromSheet });
      pool = poolAfter(pool, entry);
    }
    return { years, nextPool: pool, lastYear: last };
  }

  // ---------------------------------------------------------------------
  // MOOSE_TRENDS - real full-award point cutoffs for every Ontario WMU,
  // from the MNR's own moose tag allocation stats (2021-2025), keyed
  // MOOSE_TRENDS[wmu][mooseType][season][stage][choice] -> [[year, cutoff], ...].
  // "Full-award cutoff" = the lowest point total that got 100% of
  // applicants at that level a tag, for that WMU/type/season/stage/choice/
  // year. A missing path means no year on record ever reached a clean
  // full-award bracket for that combination (either no applicants, or it

  function sortedKeys(obj) {
    return Object.keys(obj).sort((a, b) => {
      const na = Number(a), nb = Number(b);
      if (!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
      return a.localeCompare(b);
    });
  }

  // The optional drawSlot ({stage: "Primary"|"Second Chance", choice: "1"-"3"})
  // keeps only combinations MNR published a cutoff for in that draw slot, so
  // the Group Choice menus never offer a pick that can't be forecast.
  function hasSlotData(seasonNode, drawSlot) {
    return !drawSlot || !!(seasonNode && seasonNode[drawSlot.stage] && seasonNode[drawSlot.stage][drawSlot.choice]);
  }

  function availableSeasons(wmu, mooseType, drawSlot) {
    const typeNode = MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType];
    return typeNode ? sortedKeys(typeNode).filter((season) => hasSlotData(typeNode[season], drawSlot)) : [];
  }

  function availableMooseTypes(wmu, drawSlot) {
    return MOOSE_TRENDS[wmu]
      ? sortedKeys(MOOSE_TRENDS[wmu]).filter((type) => availableSeasons(wmu, type, drawSlot).length > 0)
      : [];
  }

  function availableWMUs(drawSlot) {
    return sortedKeys(MOOSE_TRENDS).filter((wmu) => availableMooseTypes(wmu, drawSlot).length > 0);
  }

  function availableStages(wmu, mooseType, season) {
    const node = MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] && MOOSE_TRENDS[wmu][mooseType][season];
    return node ? sortedKeys(node) : [];
  }

  function availableChoices(wmu, mooseType, season, stage) {
    const seasonNode = MOOSE_TRENDS[wmu] && MOOSE_TRENDS[wmu][mooseType] && MOOSE_TRENDS[wmu][mooseType][season];
    const node = seasonNode && seasonNode[stage];
    return node ? sortedKeys(node) : [];
  }

  function getTrendSeries(target) {
    if (!target) return null;
    const node =
      MOOSE_TRENDS[target.wmu] &&
      MOOSE_TRENDS[target.wmu][target.mooseType] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season][target.stage] &&
      MOOSE_TRENDS[target.wmu][target.mooseType][target.season][target.stage][target.choice];
    if (!node) return null;
    return node.map(([year, cutoff]) => ({ year, cutoff }));
  }

  // ---------------------------------------------------------------------
  // Group Choice - the whole team is assumed to apply with the same
  // strategy, matching Ontario's real draw form: up to 3 ranked WMU/type/
  // season choices for Primary and up to 3 for Second Chance. A slot is
  // null until the group fills it in; only filled slots count toward the
  // forecast.
  // ---------------------------------------------------------------------
  const DEFAULT_GROUP_CHOICE = {
    primary: [{ wmu: "24", mooseType: "Bull", season: "Gun" }, null, null],
    secondChance: [null, null, null]
  };

  function isValidGroupChoice(value) {
    return (
      value &&
      Array.isArray(value.primary) &&
      value.primary.length === 3 &&
      Array.isArray(value.secondChance) &&
      value.secondChance.length === 3
    );
  }

  function collectChoiceSlots(groupChoice) {
    if (!groupChoice) return [];
    const list = [];
    (groupChoice.primary || []).forEach((slot, i) => {
      if (slot && slot.wmu) list.push({ stage: "Primary", choice: String(i + 1), slot });
    });
    (groupChoice.secondChance || []).forEach((slot, i) => {
      if (slot && slot.wmu) list.push({ stage: "Second Chance", choice: String(i + 1), slot });
    });
    return list;
  }

  function slotTrend(entry) {
    return getTrendSeries({
      wmu: entry.slot.wmu,
      mooseType: entry.slot.mooseType,
      season: entry.slot.season,
      stage: entry.stage,
      choice: entry.choice
    });
  }

  // The MNR's actual cutoff for a year on record; after the latest year on
  // record, that latest cutoff held flat. Null before the data starts.
  function cutoffForYear(trend, year) {
    if (!trend || !trend.length) return null;
    const exact = trend.find((p) => p.year === year);
    if (exact) return exact.cutoff;
    const latest = trend.reduce((a, b) => (b.year > a.year ? b : a));
    return year > latest.year ? latest.cutoff : null;
  }

  // Filled Group Choice slots that have MNR data, in draw order
  // (Primary 1-3, then Second Chance 1-3).
  function resolveChoiceSlots(groupChoice) {
    return collectChoiceSlots(groupChoice)
      .map((entry) => {
        const trend = slotTrend(entry);
        if (!trend) return null;
        const draw = { stage: entry.stage, choice: entry.choice };
        return Object.assign({}, entry.slot, draw, { trend, resets: tagResetsPoints(draw) });
      })
      .filter(Boolean);
  }

  const MAX_TAGS_PER_YEAR = 2;

  // Oldest first; hunters without a birth year go after those with one,
  // then most points, then alphabetical.
  function tagPriority(a, b) {
    const ay = a.hunter.birthYear || Infinity;
    const by = b.hunter.birthYear || Infinity;
    return (ay === by ? 0 : ay - by) || b.total - a.total || a.hunter.name.localeCompare(b.hunter.name);
  }

  // ---------------------------------------------------------------------
  // buildGroupMatrix - one row per hunter, one column per year. Years up
  // to a hunter's last record show their calculated points and real tags.
  // Later years are predicted for the whole group together:
  //  1. Each hunter's points go up by 1 (0 the year after a resetting tag).
  //  2. A hunter qualifies for the first Group Choice slot (Primary 1-3,
  //     then Second Chance 1-3) whose cutoff their points reach.
  //  3. Up to MAX_TAGS_PER_YEAR qualifying hunters get a tag, oldest first.
  // ---------------------------------------------------------------------
  function buildGroupMatrix(roster, groupChoice, startYear, endYear, lastHistoryYear = new Date().getFullYear()) {
    const years = [];
    for (let year = startYear; year <= endYear; year++) years.push(year);

    const hunters = roster || [];
    const slots = resolveChoiceSlots(groupChoice);
    const computed = new Map(hunters.map((h) => [h.name, computeHunterPoints(h, lastHistoryYear)]));
    const pool = new Map(hunters.map((h) => [h.name, computed.get(h.name).nextPool]));
    const cellsByHunter = new Map(hunters.map((h) => [h.name, new Map()]));
    const yearStats = [];

    years.forEach((year) => {
      const projected = [];
      hunters.forEach((hunter) => {
        const cells = cellsByHunter.get(hunter.name);
        const c = computed.get(hunter.name);
        const past = c.years.find((y) => y.year === year);
        if (past) {
          const e = past.entry;
          cells.set(year, {
            year,
            kind: "actual",
            points: past.total,
            pool: past.pool,
            sheetPoints: e && Number.isFinite(e.points) ? e.points : null,
            mismatch: past.mismatch,
            expectedFromSheet: past.expectedFromSheet,
            tagType: (e && e.tagType) || null,
            claimed: !!(e && e.claimed),
            applied: !e || e.applied !== false
          });
          return;
        }
        if (c.lastYear === null || year <= c.lastYear) {
          cells.set(year, { year, kind: "empty" });
          return;
        }
        const total = pool.get(hunter.name) + northernBonus(hunter);
        const slot =
          slots.find((s) => {
            const cutoff = cutoffForYear(s.trend, year);
            return cutoff !== null && total >= cutoff;
          }) || null;
        projected.push({ hunter, total, slot });
      });

      const winners = projected
        .filter((p) => p.slot)
        .sort(tagPriority)
        .slice(0, MAX_TAGS_PER_YEAR);

      projected.forEach((p) => {
        const tag = winners.includes(p) ? p.slot : null;
        cellsByHunter.get(p.hunter.name).set(year, { year, kind: "projected", points: p.total, qualifies: !!p.slot, tag });
        pool.set(p.hunter.name, tag && tag.resets ? 0 : pool.get(p.hunter.name) + 1);
      });

      yearStats.push({
        year,
        projected: projected.length > 0,
        tags: winners.map((w) => ({ name: w.hunter.name, slot: w.slot }))
      });
    });

    const rows = hunters.map((hunter) => ({
      name: hunter.name,
      birthYear: hunter.birthYear || null,
      cells: years.map((year) => cellsByHunter.get(hunter.name).get(year) || { year, kind: "empty" })
    }));
    const cutoffRows = slots.map((slot) => ({ slot, cutoffs: years.map((y) => cutoffForYear(slot.trend, y)) }));

    return { years, rows, yearStats, cutoffRows };
  }

  // Tags by year: what was actually awarded (from the roster), then the
  // predicted tags from the same simulation as the matrix.
  function buildTagTimeline(roster, groupChoice, startYear, endYear, lastHistoryYear = new Date().getFullYear()) {
    const matrix = buildGroupMatrix(roster, groupChoice, startYear, endYear, lastHistoryYear);
    return matrix.yearStats.map((s) => {
      const actual = [];
      (roster || []).forEach((h) =>
        (h.pointsHistory || []).forEach((e) => {
          if (e.year === s.year && e.year <= lastHistoryYear && e.tagType) {
            actual.push({ name: h.name, tagType: e.tagType, claimed: !!e.claimed });
          }
        })
      );
      return { year: s.year, actual, predicted: s.tags, projected: s.projected };
    });
  }

  // ---------------------------------------------------------------------
  // parseRosterRows - turns flat spreadsheet rows (one row per hunter per
  // year, as read from the roster .xlsx template - Hunter/Year/Points/
  // TagType/Claimed/Draw/Applied/WMU/Season/MooseType/NorthernResident/
  // BirthYear) into the
  // HUNTER_SEED-shaped roster this app renders and computes from. This is
  // the general-purpose ingestion path: any group's filled-in template
  // produces a roster the same way, regardless of who uploads it.
  // ---------------------------------------------------------------------
  // sheetRowsToObjects - turns a raw array-of-arrays sheet (as read with
  // XLSX's header:1 option) into row objects keyed by column header,
  // finding the header row itself instead of assuming it's row 1. The
  // template's own row 1 is a legend note ("Pale yellow = fields you
  // edit..."), not the Hunter/Year/Points header - reading row 1 as the
  // header (SheetJS's default) silently produced zero usable rows and
  // made every real upload of the template fail with "couldn't read that
  // file". This scans for whichever row actually contains "Hunter".
  function sheetRowsToObjects(rawRows) {
    if (!Array.isArray(rawRows)) return [];
    const headerIndex = rawRows.findIndex(
      (row) => Array.isArray(row) && row.some((cell) => String(cell == null ? "" : cell).trim().toLowerCase() === "hunter")
    );
    if (headerIndex === -1) return [];
    const headers = rawRows[headerIndex].map((h) => String(h == null ? "" : h).trim());
    return rawRows
      .slice(headerIndex + 1)
      .map((row) => {
        const obj = {};
        headers.forEach((h, i) => {
          if (!h) return;
          const cell = row[i];
          obj[h] = cell === undefined ? null : cell;
        });
        return obj;
      })
      .filter((obj) => Object.keys(obj).some((k) => obj[k] !== null && obj[k] !== ""));
  }

  function truthyFlag(value) {
    if (typeof value === "string") return value.trim().toUpperCase() === "Y";
    return !!value;
  }

  function parseBirthYear(value) {
    const n = Number(value);
    return Number.isInteger(n) && n >= 1900 && n <= 2100 ? n : null;
  }

  function parseRosterRows(rows) {
    const byHunter = new Map();
    const northernByHunter = new Map();
    const birthYearByHunter = new Map();
    (rows || []).forEach((row) => {
      const name = String(row.Hunter || row.hunter || "").trim();
      if (!name) return;

      // NorthernResident and BirthYear are per-hunter attributes, even
      // though the template has them on every row: any Y row marks the
      // hunter Northern, and the first valid birth year wins.
      if (truthyFlag(row.NorthernResident ?? row.northernResident)) northernByHunter.set(name, true);
      const birthYear = parseBirthYear(row.BirthYear ?? row.birthYear);
      if (birthYear && !birthYearByHunter.has(name)) birthYearByHunter.set(name, birthYear);

      const year = Number(row.Year ?? row.year);
      if (!Number.isInteger(year)) return;
      const rawPoints = row.Points ?? row.points;
      const points = rawPoints === null || rawPoints === undefined || rawPoints === "" ? null : Number(rawPoints);
      const appliedRaw = row.Applied ?? row.applied;
      const draw = parseDraw(row.Draw ?? row.draw);

      const entry = {
        year,
        points: Number.isFinite(points) ? points : null,
        tagType: row.TagType || row.tagType || null,
        claimed: truthyFlag(row.Claimed ?? row.claimed),
        draw: draw ? drawLabel(draw) : null,
        applied: appliedRaw === null || appliedRaw === undefined || String(appliedRaw).trim() === "" ? true : truthyFlag(appliedRaw),
        wmu: row.WMU || row.wmu || null,
        season: row.Season || row.season || null,
        mooseType: row.MooseType || row.mooseType || null
      };

      if (!byHunter.has(name)) byHunter.set(name, []);
      byHunter.get(name).push(entry);
    });

    const roster = [];
    byHunter.forEach((pointsHistory, name) => {
      pointsHistory.sort((a, b) => a.year - b.year);
      roster.push({
        name,
        pointsHistory,
        northernResident: !!northernByHunter.get(name),
        birthYear: birthYearByHunter.get(name) || null
      });
    });
    roster.sort((a, b) => a.name.localeCompare(b.name));
    return roster;
  }

  // rosterToRows - the inverse of parseRosterRows, for exporting in-browser
  // edits back to the template shape. Hunter-level fields (NorthernResident,
  // BirthYear) are written on every row so re-importing round-trips.
  function rosterToRows(roster) {
    const rows = [];
    (roster || []).forEach((hunter) => {
      hunter.pointsHistory.forEach((entry) => {
        rows.push({
          Hunter: hunter.name,
          Year: entry.year,
          Points: Number.isFinite(entry.points) ? entry.points : "",
          TagType: entry.tagType || "",
          Claimed: entry.claimed ? "Y" : "N",
          Draw: entry.draw || "",
          Applied: entry.applied === false ? "N" : "Y",
          WMU: entry.wmu || "",
          Season: entry.season || "",
          MooseType: entry.mooseType || "",
          NorthernResident: hunter.northernResident ? "Y" : "N",
          BirthYear: hunter.birthYear || ""
        });
      });
    });
    return rows;
  }

  // ---------------------------------------------------------------------
  // Persistence - localStorage only, per browser, no accounts/server. A
  // roster the user uploaded (and any in-browser edits since) survives
  // reloads; the demo HUNTER_SEED data is never persisted.
  // ---------------------------------------------------------------------
  const STORAGE_KEY = "mooseTrackerState_v1";

  function loadPersistedState() {
    try {
      if (typeof localStorage === "undefined") return null;
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function persistState() {
    try {
      if (typeof localStorage === "undefined") return;
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          roster: activeRosterIsUploaded ? activeRoster : null,
          groupChoice: groupChoice,
          altGroupChoice: altGroupChoice
        })
      );
    } catch (e) {
      // ignore quota / private-browsing errors - the app still works, just unsaved
    }
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  const RULE_KEYS = ["ruleLicence", "ruleRadius", "ruleKill", "ruleNotch", "ruleReport", "ruleWatch", "ruleAllocation2027"];

  function renderRules() {
    const container = document.getElementById("rulesCards");
    if (!container) return;
    container.innerHTML = "";
    RULE_KEYS.forEach((key) => {
      const rule = I18N[currentLang][key];
      if (!rule) return;
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.rule = key;
      const h = document.createElement("h3");
      h.textContent = rule.h;
      const p = document.createElement("p");
      p.textContent = rule.p;
      card.appendChild(h);
      card.appendChild(p);
      container.appendChild(card);
    });
  }

  // The table stays blank until a real roster exists - either uploaded
  // via the Data tab or built up with "+ Add hunter" - so nobody mistakes
  // placeholder data for their group's real numbers.
  let activeRoster = [];
  let activeRosterIsUploaded = false;
  let groupChoice = JSON.parse(JSON.stringify(DEFAULT_GROUP_CHOICE));
  // The Alternative Application tab is a second, independent Group Choice
  // over the same roster, so the group can compare "what if we applied
  // differently" against the primary strategy above. It starts blank
  // (not a copy of the default) so it's obviously a scenario to configure,
  // not a second copy of the real plan.
  const BLANK_GROUP_CHOICE = { primary: [null, null, null], secondChance: [null, null, null] };
  let altGroupChoice = JSON.parse(JSON.stringify(BLANK_GROUP_CHOICE));

  (function restorePersistedState() {
    const saved = loadPersistedState();
    if (!saved) return;
    if (saved.roster && Array.isArray(saved.roster) && saved.roster.length > 0) {
      activeRoster = saved.roster;
      activeRosterIsUploaded = true;
    }
    if (isValidGroupChoice(saved.groupChoice)) {
      groupChoice = saved.groupChoice;
    }
    if (isValidGroupChoice(saved.altGroupChoice)) {
      altGroupChoice = saved.altGroupChoice;
    }
  })();

  function setChoiceSlot(stage, index, field, value, variant) {
    const target = variant === "alt" ? altGroupChoice : groupChoice;
    const drawSlot = { stage: stage === "primary" ? "Primary" : "Second Chance", choice: String(index + 1) };
    const list = (target[stage] || []).slice();
    if (field === "wmu" && !value) {
      list[index] = null;
    } else {
      const current = list[index] || { wmu: "", mooseType: "", season: "" };
      const slot = Object.assign({}, current);
      if (field === "wmu") {
        slot.wmu = value;
        slot.mooseType = availableMooseTypes(value, drawSlot)[0] || "";
        slot.season = availableSeasons(value, slot.mooseType, drawSlot)[0] || "";
      } else if (field === "mooseType") {
        slot.mooseType = value;
        slot.season = availableSeasons(slot.wmu, value, drawSlot)[0] || "";
      } else if (field === "season") {
        slot.season = value;
      }
      list[index] = slot;
    }
    const updated = Object.assign({}, target, { [stage]: list });
    if (variant === "alt") altGroupChoice = updated;
    else groupChoice = updated;
    persistState();
    render();
  }

  function findHunter(name) {
    return activeRoster.find((h) => h.name === name);
  }

  function markEditedAndPersist() {
    activeRosterIsUploaded = true;
    persistState();
    render();
  }

  function updateEntryField(hunterName, idx, field, value) {
    const hunter = findHunter(hunterName);
    if (!hunter) return;
    // Hunter-level attributes: apply to every year for this hunter.
    if (field === "northernResident") {
      hunter.northernResident = !!value;
      markEditedAndPersist();
      return;
    }
    if (field === "birthYear") {
      hunter.birthYear = parseBirthYear(value);
      markEditedAndPersist();
      return;
    }
    const entry = hunter.pointsHistory[idx];
    if (!entry) return;
    if (field === "year") {
      const n = Number(value);
      if (Number.isInteger(n)) entry.year = n;
    } else if (field === "points") {
      const n = value === "" || value === null ? null : Number(value);
      entry.points = Number.isFinite(n) ? n : null;
    } else if (field === "claimed" || field === "applied") {
      entry[field] = !!value;
    } else if (field === "draw") {
      const draw = parseDraw(value);
      entry.draw = draw ? drawLabel(draw) : null;
    } else if (field === "tagType") {
      entry.tagType = value ? value : null;
    }
    hunter.pointsHistory.sort((a, b) => a.year - b.year);
    markEditedAndPersist();
  }

  function addYearForHunter(hunterName) {
    const hunter = findHunter(hunterName);
    if (!hunter) return;
    const lastYear = hunter.pointsHistory.length
      ? hunter.pointsHistory[hunter.pointsHistory.length - 1].year
      : new Date().getFullYear();
    hunter.pointsHistory.push({
      year: lastYear + 1,
      points: null,
      tagType: null,
      claimed: false,
      draw: null,
      applied: true,
      wmu: null,
      season: null,
      mooseType: null
    });
    markEditedAndPersist();
  }

  function deleteEntry(hunterName, idx) {
    const hunter = findHunter(hunterName);
    if (!hunter) return;
    hunter.pointsHistory.splice(idx, 1);
    markEditedAndPersist();
  }

  function addHunterNamed(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    activeRoster = activeRoster.concat([
      {
        name: trimmed,
        northernResident: false,
        birthYear: null,
        pointsHistory: [
          {
            year: new Date().getFullYear(),
            points: 0,
            tagType: null,
            claimed: false,
            draw: null,
            applied: true,
            wmu: null,
            season: null,
            mooseType: null
          }
        ]
      }
    ]);
    markEditedAndPersist();
  }

  function addHunter() {
    if (typeof prompt !== "function") return;
    addHunterNamed(prompt(t("addHunterPrompt")));
  }

  function makeEditInput(type, value, hunterName, idx, field) {
    const input = document.createElement("input");
    input.type = type;
    if (type === "checkbox") input.checked = !!value;
    else input.value = value == null ? "" : value;
    input.dataset.action = "edit-entry";
    input.dataset.name = hunterName;
    input.dataset.idx = String(idx);
    input.dataset.field = field;
    return input;
  }

  const DRAW_OPTIONS = ["Primary 1", "Primary 2", "Primary 3", "Second Chance 1", "Second Chance 2", "Second Chance 3"];

  function makeDrawSelect(value, hunterName, idx) {
    const select = document.createElement("select");
    select.dataset.action = "edit-entry";
    select.dataset.name = hunterName;
    select.dataset.idx = String(idx);
    select.dataset.field = "draw";
    fillSelect(select, DRAW_OPTIONS, value || "", "—");
    return select;
  }

  function renderRoster() {
    const body = document.getElementById("rosterBody");
    if (!body) return;
    const hint = document.getElementById("rosterEditHint");
    if (hint) hint.textContent = t("rosterEditHint");
    const addBtn = document.getElementById("addHunterBtn");
    if (addBtn) addBtn.textContent = t("addHunterBtn");
    const head = document.getElementById("rosterTableHead");
    if (head) {
      const cols = t("table");
      head.innerHTML = [cols.name, cols.birthYear, cols.northern, cols.year, cols.points, cols.tag, cols.claimed, cols.draw, cols.applied, ""]
        .map((c) => `<th>${c}</th>`)
        .join("");
    }

    const empty = document.getElementById("rosterEmpty");
    const wrap = document.getElementById("rosterWrap");
    const isEmpty = activeRoster.length === 0;
    if (empty) {
      empty.hidden = !isEmpty;
      if (isEmpty) empty.textContent = t("rosterEmptyState");
    }
    if (wrap) wrap.hidden = isEmpty;
    if (isEmpty) {
      body.innerHTML = "";
      return;
    }

    body.innerHTML = "";
    activeRoster.forEach((hunter) => {
      hunter.pointsHistory.forEach((entry, idx) => {
        const tr = document.createElement("tr");
        const cell = (child) => {
          const td = document.createElement("td");
          if (typeof child === "string" || typeof child === "number") td.textContent = child;
          else if (child) td.appendChild(child);
          return td;
        };
        tr.appendChild(cell(hunter.name));
        // Birth year and Northern are per hunter, shown once across their rows.
        if (idx === 0) {
          const rows = hunter.pointsHistory.length;
          const birthCell = cell(makeEditInput("number", hunter.birthYear || "", hunter.name, idx, "birthYear"));
          birthCell.rowSpan = rows;
          const northernCell = cell(makeEditInput("checkbox", hunter.northernResident, hunter.name, idx, "northernResident"));
          northernCell.rowSpan = rows;
          tr.append(birthCell, northernCell);
        }
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.textContent = "×";
        delBtn.dataset.action = "delete-entry";
        delBtn.dataset.name = hunter.name;
        delBtn.dataset.idx = String(idx);
        tr.append(
          cell(entry.year),
          cell(makeEditInput("number", entry.points, hunter.name, idx, "points")),
          cell(makeEditInput("text", entry.tagType || "", hunter.name, idx, "tagType")),
          cell(makeEditInput("checkbox", entry.claimed, hunter.name, idx, "claimed")),
          cell(makeDrawSelect(entry.draw, hunter.name, idx)),
          cell(makeEditInput("checkbox", entry.applied !== false, hunter.name, idx, "applied")),
          cell(delBtn)
        );
        body.appendChild(tr);
      });

      const addRow = document.createElement("tr");
      const addCell = document.createElement("td");
      addCell.colSpan = 10;
      const addYearBtn = document.createElement("button");
      addYearBtn.type = "button";
      addYearBtn.textContent = t("addYearBtn");
      addYearBtn.dataset.action = "add-year";
      addYearBtn.dataset.name = hunter.name;
      addCell.appendChild(addYearBtn);
      addRow.appendChild(addCell);
      body.appendChild(addRow);
    });
  }

  function renderBanner() {
    const banner = document.getElementById("deadlineBanner");
    if (!banner) return;
    const phase = getSeasonPhase(new Date());
    banner.textContent = t("deadline." + phase.key, phase.daysUntil);
    banner.classList.toggle("urgent", !!phase.urgent);
  }

  function renderStaticText() {
    const map = {
      appTitle: "appTitle",
      rulesHeading: "rulesHeading",
      rosterHeading: "rosterHeading",
      dataHeading: "dataHeading",
      altIntro: "altIntro"
    };
    Object.keys(map).forEach((key) => {
      const el = document.getElementById(map[key]);
      if (el) el.textContent = t(key);
    });
  }

  const FORECAST_SPAN_YEARS = 7; // years shown beyond the current year

  const CHOICE_ROWS = [
    { stage: "primary", index: 0, labelKey: "choicePrimary1" },
    { stage: "primary", index: 1, labelKey: "choicePrimary2" },
    { stage: "primary", index: 2, labelKey: "choicePrimary3" },
    { stage: "secondChance", index: 0, labelKey: "choiceSecond1" },
    { stage: "secondChance", index: 1, labelKey: "choiceSecond2" },
    { stage: "secondChance", index: 2, labelKey: "choiceSecond3" }
  ];

  function fillSelect(select, options, current, placeholder) {
    select.innerHTML = "";
    if (placeholder !== undefined) {
      const o = document.createElement("option");
      o.value = "";
      o.textContent = placeholder;
      select.appendChild(o);
    }
    options.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = opt;
      select.appendChild(o);
    });
    select.value = options.includes(current) ? current : "";
  }

  function renderChoiceTable(variant) {
    const isAlt = variant === "alt";
    const choice = isAlt ? altGroupChoice : groupChoice;
    const head = document.getElementById(isAlt ? "altChoiceTableHead" : "choiceTableHead");
    const body = document.getElementById(isAlt ? "altChoiceBody" : "choiceBody");
    if (!head || !body) return;
    const heading = document.getElementById(isAlt ? "altTargetHeading" : "targetHeading");
    if (heading) heading.textContent = t("targetHeading");
    const desc = document.getElementById(isAlt ? "altTargetDesc" : "targetDesc");
    if (desc) desc.textContent = t("targetDesc");

    const cols = t("choiceColumns");
    head.innerHTML = `<th></th><th>${cols.wmu}</th><th>${cols.type}</th><th>${cols.season}</th><th></th>`;

    body.innerHTML = "";
    let lastStage = null;
    CHOICE_ROWS.forEach((row) => {
      if (row.stage !== lastStage) {
        lastStage = row.stage;
        const sectionRow = document.createElement("tr");
        sectionRow.className = "choice-section-row";
        const td = document.createElement("td");
        td.colSpan = 5;
        td.textContent = t(row.stage === "primary" ? "choiceSectionPrimary" : "choiceSectionSecond");
        sectionRow.appendChild(td);
        body.appendChild(sectionRow);
      }

      const slot = (choice[row.stage] || [])[row.index];
      const drawSlot = { stage: row.stage === "primary" ? "Primary" : "Second Chance", choice: String(row.index + 1) };
      // A saved pick with no data stays visible (with its warning) rather than silently blanking.
      const withCurrent = (options, current) => (current && !options.includes(current) ? options.concat([current]) : options);
      const wmuOptions = availableWMUs(drawSlot);
      const tr = document.createElement("tr");
      const labelCell = document.createElement("td");
      labelCell.className = "choice-label";
      labelCell.textContent = t(row.labelKey);
      tr.appendChild(labelCell);

      const wmuCell = document.createElement("td");
      const wmuSel = document.createElement("select");
      wmuSel.dataset.action = "edit-choice";
      wmuSel.dataset.stage = row.stage;
      wmuSel.dataset.index = String(row.index);
      wmuSel.dataset.field = "wmu";
      if (variant === "alt") wmuSel.dataset.variant = "alt";
      fillSelect(wmuSel, withCurrent(wmuOptions, slot && slot.wmu), slot ? slot.wmu : "", t("choiceNone"));
      wmuSel.disabled = !slot && wmuOptions.length === 0;
      wmuCell.appendChild(wmuSel);
      tr.appendChild(wmuCell);

      const typeCell = document.createElement("td");
      const typeSel = document.createElement("select");
      typeSel.dataset.action = "edit-choice";
      typeSel.dataset.stage = row.stage;
      typeSel.dataset.index = String(row.index);
      typeSel.dataset.field = "mooseType";
      if (variant === "alt") typeSel.dataset.variant = "alt";
      typeSel.disabled = !slot;
      fillSelect(typeSel, slot ? withCurrent(availableMooseTypes(slot.wmu, drawSlot), slot.mooseType) : [], slot ? slot.mooseType : "");
      typeCell.appendChild(typeSel);
      tr.appendChild(typeCell);

      const seasonCell = document.createElement("td");
      const seasonSel = document.createElement("select");
      seasonSel.dataset.action = "edit-choice";
      seasonSel.dataset.stage = row.stage;
      seasonSel.dataset.index = String(row.index);
      seasonSel.dataset.field = "season";
      if (variant === "alt") seasonSel.dataset.variant = "alt";
      seasonSel.disabled = !slot;
      fillSelect(seasonSel, slot ? withCurrent(availableSeasons(slot.wmu, slot.mooseType, drawSlot), slot.season) : [], slot ? slot.season : "");
      seasonCell.appendChild(seasonSel);
      tr.appendChild(seasonCell);

      const warnCell = document.createElement("td");
      warnCell.className = "choice-nodata";
      if (slot && !slotTrend({ stage: drawSlot.stage, choice: drawSlot.choice, slot })) {
        warnCell.textContent = t("choiceNoData");
      } else if (!slot && wmuOptions.length === 0) {
        warnCell.textContent = t("choiceNoSlotData");
      }
      tr.appendChild(warnCell);

      body.appendChild(tr);
    });
  }

  // Years shown in the Overview tables: the earliest record (or this year)
  // through FORECAST_SPAN_YEARS ahead.
  function displayYearRange() {
    const currentYear = new Date().getFullYear();
    const historyYears = activeRoster.flatMap((h) => (h.pointsHistory || []).map((e) => e.year));
    const startYear = historyYears.length ? Math.min(currentYear, ...historyYears) : currentYear;
    return { currentYear, startYear, endYear: currentYear + FORECAST_SPAN_YEARS };
  }

  function stageLabel(stage) {
    return t(stage === "Primary" ? "stagePrimary" : "stageSecond");
  }

  function slotLabel(slot) {
    return `${slot.mooseType} ${slot.season} · ${t("choiceColumns").wmu} ${slot.wmu} · ${stageLabel(slot.stage)} ${slot.choice}`;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function renderTimelineTable(variant) {
    const isAlt = variant === "alt";
    const choice = isAlt ? altGroupChoice : groupChoice;
    const head = document.getElementById(isAlt ? "altTimelineTableHead" : "timelineTableHead");
    const body = document.getElementById(isAlt ? "altTimelineBody" : "timelineBody");
    if (!head || !body) return;
    const heading = document.getElementById(isAlt ? "altTimelineHeading" : "timelineHeading");
    if (heading) heading.textContent = t("timelineHeading");
    const desc = document.getElementById(isAlt ? "altTimelineDesc" : "timelineDesc");
    if (desc) desc.textContent = t("timelineDesc");

    const cols = t("timelineColumns");
    head.innerHTML = `<th>${cols.year}</th><th>${cols.tags}</th>`;
    body.innerHTML = "";
    if (activeRoster.length === 0) {
      const tr = el("tr");
      const td = el("td", null, t("timelineEmpty"));
      td.colSpan = 2;
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }

    const { currentYear, startYear, endYear } = displayYearRange();
    buildTagTimeline(activeRoster, choice, startYear, endYear, currentYear).forEach((row) => {
      const tr = el("tr", row.year === currentYear ? "timeline-current" : null);
      tr.appendChild(el("td", "timeline-year", row.year));
      const tagsCell = el("td");
      row.actual.forEach((tag) => {
        const item = el("div", "timeline-tag", `${tag.name} — ${tag.tagType}`);
        item.appendChild(el("span", "timeline-status", tag.claimed ? " ✓" : ` (${t("tagNotClaimed")})`));
        tagsCell.appendChild(item);
      });
      row.predicted.forEach((tag) => {
        const item = el("div", "timeline-tag timeline-predicted");
        item.appendChild(el("span", "pill", t("timelinePredicted")));
        item.appendChild(document.createTextNode(` ${tag.name} — ${slotLabel(tag.slot)}`));
        tagsCell.appendChild(item);
      });
      if (!row.actual.length && !row.predicted.length) tagsCell.appendChild(el("span", "timeline-none", t("timelineNone")));
      tr.appendChild(tagsCell);
      body.appendChild(tr);
    });
  }

  const MATRIX_SORT_KEYS = { NAME: "name" };

  function matrixCellValue(row, key) {
    if (key === MATRIX_SORT_KEYS.NAME) return row.name;
    const cell = row.cells.find((c) => c.year === key);
    if (!cell || cell.kind === "empty") return -Infinity;
    return cell.points;
  }

  // sortMatrixRows - lets any column (hunter name, or any year) become the
  // sort key, so the group can answer "who's ready soonest" by clicking a
  // year instead of reading the whole table.
  function sortMatrixRows(matrix, key, direction) {
    const dir = direction === "desc" ? -1 : 1;
    const rows = matrix.rows.slice().sort((a, b) => {
      const va = matrixCellValue(a, key);
      const vb = matrixCellValue(b, key);
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return a.name.localeCompare(b.name);
    });
    return Object.assign({}, matrix, { rows });
  }

  function renderMatrix(variant) {
    const isAlt = variant === "alt";
    const choice = isAlt ? altGroupChoice : groupChoice;
    const sort = isAlt ? altMatrixSort : matrixSort;
    const head = document.getElementById(isAlt ? "altMatrixTableHead" : "matrixTableHead");
    const body = document.getElementById(isAlt ? "altMatrixBody" : "matrixBody");
    if (!head || !body) return;
    const heading = document.getElementById(isAlt ? "altMatrixHeading" : "matrixHeading");
    if (heading) heading.textContent = t("matrixHeading");
    const desc = document.getElementById(isAlt ? "altMatrixDesc" : "matrixDesc");
    if (desc) desc.textContent = t("matrixDesc");

    const empty = document.getElementById(isAlt ? "altMatrixEmpty" : "matrixEmpty");
    const wrap = document.getElementById(isAlt ? "altMatrixWrap" : "matrixWrap");
    const isEmpty = activeRoster.length === 0;
    if (empty) {
      empty.hidden = !isEmpty;
      if (isEmpty) empty.textContent = t("matrixEmptyState");
    }
    if (wrap) wrap.hidden = isEmpty;
    if (isEmpty) {
      head.innerHTML = "";
      body.innerHTML = "";
      return;
    }

    const { currentYear, startYear, endYear } = displayYearRange();
    let matrix = buildGroupMatrix(activeRoster, choice, startYear, endYear, currentYear);
    matrix = sortMatrixRows(matrix, sort.key, sort.direction);

    const note = document.getElementById(isAlt ? "altMatrixNote" : "matrixNote");
    if (note) {
      const missing = activeRoster.filter((h) => !h.birthYear).map((h) => h.name);
      note.hidden = missing.length === 0;
      note.textContent = missing.length ? t("birthYearMissing", missing.join(", ")) : "";
    }

    const nameLabel = t("table").name;
    const arrow = sort.direction === "desc" ? " ▾" : " ▴";
    function headerCell(key, label) {
      const sorted = sort.key === key;
      return (
        '<th class="matrix-col' +
        (key === currentYear ? " matrix-current" : "") +
        '"><button type="button" class="matrix-sort-btn' +
        (sorted ? " active" : "") +
        '" data-action="sort-matrix" data-key="' +
        key +
        (isAlt ? '" data-variant="alt' : "") +
        '">' +
        label +
        (sorted ? arrow : "") +
        "</button></th>"
      );
    }
    head.innerHTML = headerCell("name", nameLabel) + matrix.years.map((y) => headerCell(y, y)).join("");

    body.innerHTML = "";

    // Cutoff rows: the number each hunter's points are compared to, per
    // Group Choice slot - MNR's actual figure for past years, the latest
    // one held flat after that.
    matrix.cutoffRows.forEach((cutoffRow) => {
      const tr = el("tr", "matrix-cutoff-row");
      tr.appendChild(el("td", "matrix-name matrix-cutoff-label", `${t("matrixCutoffLabel")} – ${slotLabel(cutoffRow.slot)}`));
      cutoffRow.cutoffs.forEach((cutoff, i) => {
        const td = el("td", "matrix-cell matrix-cutoff", cutoff === null ? "–" : cutoff);
        if (matrix.years[i] === currentYear) td.classList.add("matrix-current");
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    matrix.rows.forEach((row) => {
      const tr = el("tr");
      const nameCell = el("td", "matrix-name", row.name);
      if (row.birthYear) nameCell.appendChild(el("span", "matrix-birth", ` ${row.birthYear}`));
      tr.appendChild(nameCell);
      row.cells.forEach((cell) => {
        const td = el("td", "matrix-cell matrix-" + cell.kind);
        if (cell.qualifies && !cell.tag) td.classList.add("matrix-ready");
        if (cell.tag) td.classList.add("matrix-sequence-tag");
        if (cell.year === currentYear) td.classList.add("matrix-current");
        if (cell.kind === "actual") {
          td.appendChild(document.createTextNode(cell.points));
          if (cell.mismatch) {
            const flag = el("span", "matrix-flag", "!");
            flag.title = t("matrixMismatch", cell.sheetPoints, cell.expectedFromSheet);
            td.appendChild(flag);
          }
          if (cell.tagType) {
            td.appendChild(el("div", "matrix-tag", cell.tagType + (cell.claimed ? " ✓" : ` (${t("tagNotClaimed")})`)));
          }
          if (!cell.applied) td.appendChild(el("div", "matrix-tag matrix-skipped", t("matrixNotApplied")));
        } else if (cell.kind === "projected") {
          td.appendChild(document.createTextNode(cell.points));
          if (cell.tag) {
            const badge = el("div", "matrix-tag matrix-tag-sim", `${t("matrixSequenceBadge")} · ${cell.tag.mooseType}`);
            td.title = slotLabel(cell.tag);
            td.appendChild(badge);
          }
        } else {
          td.textContent = "–";
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    const legend = document.getElementById(isAlt ? "altMatrixLegend" : "matrixLegend");
    if (legend) legend.innerHTML = t("matrixLegend");
  }

  function renderDataStatus() {
    const status = document.getElementById("dataStatus");
    if (status) {
      const count = activeRoster.length;
      if (lastUpload && count > 0) status.textContent = t("dataStatusLoaded", count, lastUpload.name, clockTime(lastUpload.time));
      else status.textContent = count > 0 ? t("dataStatusUploaded", count) : t("dataStatusEmpty");
    }
    const exportBtn = document.getElementById("exportBtn");
    if (exportBtn) exportBtn.textContent = t("exportBtn");
  }

  // ---------------------------------------------------------------------
  // Tabs - the app used to be one long scroll of unrelated sections
  // (rules, roster, target, chart, forecast, data all stacked). Splitting
  // it into tabs groups related tools together and gives a first, glanceable
  // "Overview" screen instead of making the reader scroll past everything.
  // ---------------------------------------------------------------------
  const TAB_IDS = ["overview", "alt", "roster", "rules", "data"];
  let activeTab = "overview";
  let matrixSort = { key: "name", direction: "asc" };
  let altMatrixSort = { key: "name", direction: "asc" };

  function sortMatrixBy(key, variant) {
    const isAlt = variant === "alt";
    const current = isAlt ? altMatrixSort : matrixSort;
    const numericKey = key === "name" ? "name" : Number(key);
    const next =
      current.key === numericKey
        ? { key: numericKey, direction: current.direction === "asc" ? "desc" : "asc" }
        : { key: numericKey, direction: "asc" };
    if (isAlt) altMatrixSort = next;
    else matrixSort = next;
    renderMatrix(variant);
  }

  function showTab(name) {
    if (!TAB_IDS.includes(name)) return;
    activeTab = name;
    renderTabs();
  }

  function renderTabs() {
    const nav = document.getElementById("tabNav");
    if (!nav) return;
    TAB_IDS.forEach((id) => {
      const btn = document.getElementById("tabBtn" + id.charAt(0).toUpperCase() + id.slice(1));
      if (btn) {
        btn.textContent = t("tab" + id.charAt(0).toUpperCase() + id.slice(1));
        btn.classList.toggle("active", id === activeTab);
      }
      const panel = document.getElementById("tab-" + id);
      if (panel) panel.classList.toggle("active", id === activeTab);
    });
  }

  function render() {
    renderStaticText();
    renderBanner();
    renderRules();
    renderRoster();
    renderChoiceTable("overview");
    renderTimelineTable("overview");
    renderMatrix("overview");
    renderChoiceTable("alt");
    renderTimelineTable("alt");
    renderMatrix("alt");
    renderDataStatus();
    renderTabs();
    const toggle = document.getElementById("langToggle");
    if (toggle) toggle.textContent = currentLang === "en" ? "FR" : "EN";
    const version = document.getElementById("appVersion");
    if (version) version.textContent = t("versionLabel", APP_VERSION);
    const recalcBtn = document.getElementById("recalcBtn");
    if (recalcBtn) recalcBtn.textContent = t("recalcBtn");
    const stamp = document.getElementById("calcStamp");
    if (stamp) stamp.textContent = t("calcStamp", clockTime(new Date()));
  }

  function clockTime(date) {
    return date.toLocaleTimeString(currentLang === "fr" ? "fr-CA" : "en-CA", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function loadRoster(roster) {
    activeRoster = roster;
    activeRosterIsUploaded = true;
    persistState();
    render();
  }

  let lastUpload = null;

  function handleRosterFile(file) {
    if (!file) return;
    const status = document.getElementById("dataStatus");
    if (typeof XLSX === "undefined") {
      if (status) status.textContent = t("dataStatusNoReader");
      return;
    }
    file
      .arrayBuffer()
      .then((buffer) => {
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheetName =
          workbook.SheetNames.find((n) => /points/i.test(n)) ||
          workbook.SheetNames[workbook.SheetNames.length - 1];
        const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: null });
        const rows = sheetRowsToObjects(rawRows);
        const roster = parseRosterRows(rows);
        if (roster.length === 0) throw new Error("empty roster");
        lastUpload = { name: file.name, time: new Date() };
        loadRoster(roster);
      })
      .catch(() => {
        if (status) status.textContent = t("dataStatusError");
      });
  }

  function exportRoster() {
    if (typeof XLSX === "undefined") return;
    const rows = rosterToRows(activeRoster);
    const sheet = XLSX.utils.json_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, "Points Tracker");
    XLSX.writeFile(workbook, "moose-group-points-export.xlsx");
  }

  function setLang(lang) {
    if (lang !== "en" && lang !== "fr") return;
    currentLang = lang;
    render();
  }

  function toggleLang() {
    setLang(currentLang === "en" ? "fr" : "en");
  }

  function handleDelegatedChange(event) {
    const el = event.target;
    if (!el || !el.dataset) return;
    if (el.dataset.action === "edit-entry") {
      const value = el.type === "checkbox" ? el.checked : el.value;
      updateEntryField(el.dataset.name, Number(el.dataset.idx), el.dataset.field, value);
      return;
    }
    if (el.dataset.action === "edit-choice") {
      setChoiceSlot(el.dataset.stage, Number(el.dataset.index), el.dataset.field, el.value, el.dataset.variant);
    }
  }

  function handleDelegatedClick(event) {
    const el = event.target.closest && event.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action === "add-year") addYearForHunter(el.dataset.name);
    else if (action === "delete-entry") deleteEntry(el.dataset.name, Number(el.dataset.idx));
    else if (action === "add-hunter") addHunter();
    else if (action === "export-roster") exportRoster();
    else if (action === "show-tab") showTab(el.dataset.tab);
    else if (action === "sort-matrix") sortMatrixBy(el.dataset.key, el.dataset.variant);
    else if (action === "recalc") render();
  }

  if (typeof document !== "undefined") {
    document.addEventListener("change", handleDelegatedChange);
    document.addEventListener("click", handleDelegatedClick);
    document.addEventListener("DOMContentLoaded", function () {
      const toggle = document.getElementById("langToggle");
      if (toggle) toggle.addEventListener("click", toggleLang);
      const upload = document.getElementById("rosterUpload");
      if (upload) {
        upload.addEventListener("change", function (event) {
          const file = event.target.files && event.target.files[0];
          handleRosterFile(file);
          // Browsers don't fire "change" when the same filename is picked
          // again, so an edited-and-re-uploaded roster was silently ignored.
          event.target.value = "";
        });
      }
      render();
    });
  }

  // Expose for tests (jsdom) without affecting the browser UI.
  if (typeof window !== "undefined") {
    window.APP = {
      I18N,
      t,
      setLang,
      showTab,
      getActiveTab: () => activeTab,
      getLang: () => currentLang,
      HUNTER_SEED,
      getSeasonPhase,
      parseRosterRows,
      sheetRowsToObjects,
      rosterToRows,
      parseDraw,
      computeHunterPoints,
      loadRoster,
      getActiveRoster: () => activeRoster,
      isRosterUploaded: () => activeRosterIsUploaded,
      NORTHERN_PREFERENCE_POINT,
      MAX_TAGS_PER_YEAR,
      MOOSE_TRENDS,
      DEFAULT_GROUP_CHOICE,
      getGroupChoice: () => groupChoice,
      getAltGroupChoice: () => altGroupChoice,
      BLANK_GROUP_CHOICE,
      setChoiceSlot,
      getTrendSeries,
      availableWMUs,
      availableMooseTypes,
      availableSeasons,
      availableStages,
      availableChoices,
      collectChoiceSlots,
      cutoffForYear,
      buildGroupMatrix,
      buildTagTimeline,
      sortMatrixRows,
      sortMatrixBy,
      getMatrixSort: () => matrixSort,
      getAltMatrixSort: () => altMatrixSort,
      renderMatrix,
      renderChoiceTable,
      renderTimelineTable,
      updateEntryField,
      addYearForHunter,
      deleteEntry,
      addHunterNamed,
      render
    };
  }
})();
</script>

</div>
</body>
</html>
